[project]
name = "facet-audiogram"
version = "0.1.0"
description = "Audio-reactive waveform or frequency-bars MP4 videos with NumPy, soundfile and Pillow through the bundled imageio-ffmpeg binary."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "imageio-ffmpeg==0.6.0",
  "numpy==2.5.4",
  "pillow==13.0.0",
  "soundfile==0.13.1",
]

[tool.uv]
package = false
