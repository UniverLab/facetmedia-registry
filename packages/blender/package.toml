name = "blender"
version = "0.1.0"
requires_facet = ">=0.1.0b1,<0.2"
protocol = 1
provider = "Blender project (Blender Foundation)"
tool_name = "Blender"
description = "Daylight architectural photos of CadQuery glTF models with Blender Cycles on the GPU and animated camera tours in Eevee, checked by pixel size and an MP4 probe"
facet = "image"

[engine]
type = "host-app"

[engine.host_app]
app = "blender"
min_version = "5.2"
config_key = "blender.path"
env = "BLENDER_EXE"

[transport]
type = "cli"
entry = "runner.py"
invocation_template = "{{app}} {{entry}} -- {{verb}} --input {{input}} --result {{result}}"

[requirements]
gpu = true
ram_gb = 4
disk_gb = 0.1
exclusive = true
platforms = ["linux"]

[[licenses]]
subject = "Blender (the host application this package drives)"
spdx = "GPL-2.0-or-later"

[capabilities.photo]
summary = "Daylight architectural photo of a CadQuery glTF with Cycles on the GPU (1600x1000, ~11 s)"
kind = "image"

[capabilities.photo.inputs.model]
type = "path"
required = true
description = "glTF (.glb) exported by cad.solid from a CadQuery Assembly, one element per piece carrying its name, resolved relative to the piece file; never STEP, which Blender does not open without an extra plugin."

[capabilities.photo.inputs.camera]
type = "array"
description = "Camera view as one { azimuth, elevation, scale } item: degrees for the two angles, the orthographic scale in metres; when scale is omitted it is computed to fit the whole model with a 10% margin."

[capabilities.photo.inputs.camera.items.azimuth]
type = "number"
default = -40
min = -360
max = 360
description = "Azimuth in degrees, measured from +X towards +Y."

[capabilities.photo.inputs.camera.items.elevation]
type = "number"
default = 48
min = -89
max = 89
description = "Elevation in degrees above the floor."

[capabilities.photo.inputs.camera.items.scale]
type = "number"
min = 0.5
max = 200
description = "Orthographic scale in metres: the width of the frame the camera fits; when omitted, computed to fit the whole model with a 10% margin."

[capabilities.photo.inputs.rotation]
type = "number"
default = 0
min = -360
max = 360
description = "Turn of the whole model about Z in degrees; the sun keeps its place, so the light changes with the facade."

[capabilities.photo.inputs.exposure]
type = "number"
default = -0.6
min = -10
max = 10
description = "Exposure in stops under the AgX - Medium High Contrast view transform; -0.6 keeps sun plus sky wash from washing the colours out."

[capabilities.photo.inputs.people-blend]
type = "path"
description = "Prebuilt MPFB collection .blend (one collection per person, the skeleton root at its base), resolved relative to the piece file. Never generated here."

[capabilities.photo.inputs.people]
type = "array"
default = []
description = "People to stand in the scene, one { name, x, y, rotation } item each: the collection name in people-blend and its place in metres. The lab's three placements are the reference example, never a default."

[capabilities.photo.inputs.people.items.name]
type = "string"
required = true
description = "Collection name in people-blend; a name the file does not hold fails the run loudly."

[capabilities.photo.inputs.people.items.x]
type = "number"
required = true
description = "X position in metres, in the scene's own axes; people are never scaled with the model."

[capabilities.photo.inputs.people.items.y]
type = "number"
required = true
description = "Y position in metres, in the scene's own axes."

[capabilities.photo.inputs.people.items.rotation]
type = "number"
default = 0
description = "Turn about Z in degrees from the -y facing the collection has by default."

[capabilities.photo.inputs.cars-blend]
type = "path"
description = "Prebuilt car-collection .blend (one collection per car hung from an anchor EMPTY at its base centre, facing -y), resolved relative to the piece file. Never generated here."

[capabilities.photo.inputs.cars]
type = "array"
default = []
description = "Cars to park in the scene, one { name, x, y, rotation } item each: the collection name in cars-blend and its place in metres. The lab's sedan, camioneta and compacto placements are the reference example, never a default."

[capabilities.photo.inputs.cars.items.name]
type = "string"
required = true
description = "Collection name in cars-blend; a name the file does not hold fails the run loudly."

[capabilities.photo.inputs.cars.items.x]
type = "number"
required = true
description = "X position in metres, in the scene's own axes; cars are never scaled with the model."

[capabilities.photo.inputs.cars.items.y]
type = "number"
required = true
description = "Y position in metres, in the scene's own axes."

[capabilities.photo.inputs.cars.items.rotation]
type = "number"
default = 0
description = "Turn about Z in degrees from the -y facing the collection has by default."

[capabilities.photo.inputs.sky]
type = "array"
default = []
description = "Sky as one { id, rotation, strength } item: the Poly Haven HDRI id, its turn about Z in degrees and the background strength; the scene then has no sun lamp. The runner reads only the first item."

[capabilities.photo.inputs.sky.items.id]
type = "string"
required = true
description = "Poly Haven HDRI id, the last part of its polyhaven.com URL; it must already be fetched with blender.assets."

[capabilities.photo.inputs.sky.items.rotation]
type = "number"
default = 200
description = "Turn of the HDRI about Z in degrees, which sets where the sun falls."

[capabilities.photo.inputs.sky.items.strength]
type = "number"
default = 1.0
description = "Background strength of the HDRI sky."

[capabilities.photo.inputs.textures]
type = "array"
default = []
description = "Textures by piece prefix, one { prefix, id, size, hue, saturation, value } item each; a prefix without an item keeps its flat MATERIALS colour."

[capabilities.photo.inputs.textures.items.prefix]
type = "enum"
values = ["almohada", "cama", "mesa", "muros", "pavimento", "piso", "sillas", "suelo", "vidrio"]
required = true
description = "Piece-name prefix the texture dresses, one of the keys of MATERIALS in escena.py; the values come from the piece names in your own CAD model, so they keep the model's spelling."

[capabilities.photo.inputs.textures.items.id]
type = "string"
required = true
description = "Poly Haven texture id, the last part of its polyhaven.com URL; it must already be fetched with blender.assets."

[capabilities.photo.inputs.textures.items.size]
type = "number"
default = 2.0
description = "Tile side in metres of the box projection."

[capabilities.photo.inputs.textures.items.hue]
type = "number"
default = 0.5
description = "Hue adjust of the lab's ajuste triple; 0.5 keeps the hue."

[capabilities.photo.inputs.textures.items.saturation]
type = "number"
default = 1.0
description = "Saturation adjust of the lab's ajuste triple."

[capabilities.photo.inputs.textures.items.value]
type = "number"
default = 1.0
description = "Value adjust of the lab's ajuste triple."

[capabilities.photo.inputs.plants]
type = "array"
default = []
description = "Plants to stand in the scene, one { id, x, y, rotation } item each: the Poly Haven model id and its place in metres."

[capabilities.photo.inputs.plants.items.id]
type = "string"
required = true
description = "Poly Haven model id, the last part of its polyhaven.com URL; it must already be fetched with blender.assets."

[capabilities.photo.inputs.plants.items.x]
type = "number"
required = true
description = "X position in metres, in the scene's own axes."

[capabilities.photo.inputs.plants.items.y]
type = "number"
required = true
description = "Y position in metres, in the scene's own axes."

[capabilities.photo.inputs.plants.items.rotation]
type = "number"
default = 0
description = "Turn about Z in degrees."

[capabilities.photo.preview]
viewer = "image"

[capabilities.product]
summary = "Studio product photo of a CAD STL under two area lights with Cycles on the GPU (1200x1200, ~10 s)"
kind = "image"

[capabilities.product.inputs.part]
type = "path"
required = true
description = "STL (.stl) written by cad.solid beside the piece, resolved relative to the piece file; millimetres, scaled to metres by the runner."

[capabilities.product.inputs.material]
type = "enum"
values = ["brushed-aluminum", "steel"]
default = "brushed-aluminum"
description = "Metal the whole part is dressed in: brushed aluminium (roughness 0.38) or steel (roughness 0.22); both fully metallic."

[capabilities.product.inputs.backdrop]
type = "enum"
values = ["graphite", "concrete"]
default = "graphite"
description = "Seamless backdrop: graphite (near black) or cement (dark grey); both keep the metal's contrast."

[capabilities.product.inputs.exposure]
type = "number"
default = -0.2
min = -3.0
max = 3.0
description = "Exposure in stops under the AgX - Medium High Contrast view transform; lower it when the metal comes out too bright or burnt, raise it when the shot is too dark."

[capabilities.product.inputs.fill]
type = "number"
default = 0.6
min = 0.2
max = 0.95
description = "Fraction of the frame's height the part's bounding sphere spans; raise it when the part looks too small, lower it when the shot is cropped."

[capabilities.product.inputs.light]
type = "number"
default = 1.0
min = 0.1
max = 10.0
description = "Multiplier on the energy the light plan derives from the part's span; raise it when the shot is flat, lower it when the highlights are harsh."

[capabilities.product.preview]
viewer = "image"

[capabilities.assets]
summary = "Versioned Poly Haven skies, textures and models fetched once into the shared models dir, with a receipt that verify re-checks."
kind = "text"

[capabilities.assets.inputs.name]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"
description = "Asset base name: writes <name>.assets.json, the receipt of every fetched file."

[capabilities.assets.inputs.assets]
type = "array"
required = true
min_items = 1
description = "Poly Haven assets to fetch; one piece carries one fetch list."

[capabilities.assets.inputs.assets.items.id]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9_-]*$"
description = "Poly Haven asset id, the last part of its polyhaven.com URL."

[capabilities.assets.inputs.assets.items.res]
type = "enum"
values = ["1k", "2k", "4k"]
description = "Pinned resolution; the lab default applies when omitted (2k for skies and textures, 1k for models)."

[capabilities.assets.preview]
viewer = "generic"

[capabilities.tour]
summary = "Animated camera tour of a CadQuery glTF in Eevee on the GPU (240 frames at 1280x720, 24 fps, ~100 s)"
kind = "video"

[capabilities.tour.inputs.model]
type = "path"
required = true
description = "glTF (.glb) exported by cad.solid from a CadQuery Assembly, one element per piece carrying its name, resolved relative to the piece file; never STEP, which Blender does not open without an extra plugin."

[capabilities.tour.inputs.azimuth]
type = "array"
description = "Azimuth the camera starts and ends at, as one { start, end } item in degrees, measured from +X towards +Y; the lab's orbit when omitted."

[capabilities.tour.inputs.azimuth.items.start]
type = "number"
default = -75
min = -360
max = 360
description = "Azimuth in degrees on the first frame."

[capabilities.tour.inputs.azimuth.items.end]
type = "number"
default = -15
min = -360
max = 360
description = "Azimuth in degrees on the last frame."

[capabilities.tour.inputs.elevation]
type = "array"
description = "Elevation the camera starts and ends at, as one { start, end } item in degrees above the floor."

[capabilities.tour.inputs.elevation.items.start]
type = "number"
default = 55
min = -89
max = 89
description = "Elevation in degrees on the first frame."

[capabilities.tour.inputs.elevation.items.end]
type = "number"
default = 40
min = -89
max = 89
description = "Elevation in degrees on the last frame."

[capabilities.tour.inputs.distance]
type = "array"
description = "Distance from the model's centre the camera starts and ends at, as one { start, end } item in metres; the move starts far and comes closer."

[capabilities.tour.inputs.distance.items.start]
type = "number"
default = 14.0
min = 0.5
max = 200
description = "Distance in metres on the first frame."

[capabilities.tour.inputs.distance.items.end]
type = "number"
default = 10.5
min = 0.5
max = 200
description = "Distance in metres on the last frame."

[capabilities.tour.inputs.focal]
type = "number"
default = 30
min = 18
max = 100
description = "Lens focal length in millimetres; 30 mm frames the study from 14 m."

[capabilities.tour.inputs.seconds]
type = "integer"
default = 10
min = 2
max = 60
description = "Clip length in seconds; the frame count is seconds x fps."

[capabilities.tour.inputs.fps]
type = "integer"
default = 24
min = 12
max = 60
description = "Frame rate; the lab's 24 fps plays the orbit smoothly."

[capabilities.tour.inputs.seed]
type = "integer"
default = 0
min = 0
description = "Sampling seed; Eevee's render is deterministic, so it only labels the record."

[capabilities.tour.inputs.people-blend]
type = "path"
description = "Prebuilt MPFB collection .blend (one collection per person, the skeleton root at its base), resolved relative to the piece file. Never generated here."

[capabilities.tour.inputs.people]
