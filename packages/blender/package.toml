name = "blender"
version = "0.1.0"
requires_facet = ">=0.1.0b1,<0.2"
protocol = 1
provider = "Blender project (Blender Foundation)"
tool_name = "Blender"
description = "Daylight architectural photos of CadQuery glTF models with Blender Cycles on the GPU and animated camera tours in Eevee, checked by pixel size and an MP4 probe"
facet = "image"

[engine]
type = "host-app"

[engine.host_app]
app = "blender"
min_version = "5.2"
config_key = "blender.path"
env = "BLENDER_EXE"

[transport]
type = "cli"
entry = "runner.py"
invocation_template = "{{app}} {{entry}} -- {{verb}} --input {{input}} --result {{result}}"

[requirements]
gpu = true
ram_gb = 4
disk_gb = 0.1
exclusive = true
platforms = ["linux"]

[[licenses]]
subject = "Blender (the host application this package drives)"
spdx = "GPL-2.0-or-later"

[capabilities.foto]
summary = "Daylight architectural photo of a CadQuery glTF with Cycles on the GPU (1600x1000, ~11 s)"
kind = "image"

[capabilities.foto.inputs.model]
type = "path"
required = true
description = "glTF (.glb) exported by cad.solid from a CadQuery Assembly, one element per piece carrying its name, resolved relative to the piece file; never STEP, which Blender does not open without an extra plugin."

[capabilities.foto.inputs.camera]
type = "array"
description = "Camera view as one { azimut, elevacion, escala } item: degrees for the two angles, the orthographic scale in metres; the lab's axonometric view when omitted."

[capabilities.foto.inputs.camera.items.azimut]
type = "number"
default = -40
min = -360
max = 360
description = "Azimuth in degrees, measured from +X towards +Y."

[capabilities.foto.inputs.camera.items.elevacion]
type = "number"
default = 48
min = -89
max = 89
description = "Elevation in degrees above the floor."

[capabilities.foto.inputs.camera.items.escala]
type = "number"
default = 11.5
min = 0.5
max = 200
description = "Orthographic scale in metres: the width of the frame the camera fits."

[capabilities.foto.inputs.giro]
type = "number"
default = 0
min = -360
max = 360
description = "Turn of the whole model about Z in degrees; the sun keeps its place, so the light changes with the facade."

[capabilities.foto.inputs.exposure]
type = "number"
default = -0.6
min = -10
max = 10
description = "Exposure in stops under the AgX - Medium High Contrast view transform; -0.6 keeps sun plus sky wash from washing the colours out."

[capabilities.foto.inputs.personas-blend]
type = "path"
description = "Prebuilt MPFB collection .blend (one collection per person, the skeleton root at its base), resolved relative to the piece file; the lab builds it once with projects/prueba-render-arq/personas.py. Never generated here."

[capabilities.foto.inputs.personas]
type = "array"
default = []
description = "People to stand in the scene, one { nombre, x, y, giro } item each: the collection name in personas-blend and its place in metres. The lab's three placements are the reference example, never a default."

[capabilities.foto.inputs.personas.items.nombre]
type = "string"
required = true
description = "Collection name in personas-blend; a name the file does not hold fails the run loudly."

[capabilities.foto.inputs.personas.items.x]
type = "number"
required = true
description = "X position in metres, in the scene's own axes; people are never scaled with the model."

[capabilities.foto.inputs.personas.items.y]
type = "number"
required = true
description = "Y position in metres, in the scene's own axes."

[capabilities.foto.inputs.personas.items.giro]
type = "number"
default = 0
description = "Turn about Z in degrees from the -y facing the collection has by default."

[capabilities.foto.inputs.autos-blend]
type = "path"
description = "Prebuilt car-collection .blend (one collection per car hung from an anchor EMPTY at its base centre, facing -y), resolved relative to the piece file; the lab builds it once with projects/prueba-render-arq/autos.py. Never generated here."

[capabilities.foto.inputs.autos]
type = "array"
default = []
description = "Cars to park in the scene, one { nombre, x, y, giro } item each: the collection name in autos-blend and its place in metres. The lab's sedan, camioneta and compacto placements are the reference example, never a default."

[capabilities.foto.inputs.autos.items.nombre]
type = "string"
required = true
description = "Collection name in autos-blend; a name the file does not hold fails the run loudly."

[capabilities.foto.inputs.autos.items.x]
type = "number"
required = true
description = "X position in metres, in the scene's own axes; cars are never scaled with the model."

[capabilities.foto.inputs.autos.items.y]
type = "number"
required = true
description = "Y position in metres, in the scene's own axes."

[capabilities.foto.inputs.autos.items.giro]
type = "number"
default = 0
description = "Turn about Z in degrees from the -y facing the collection has by default."

[capabilities.foto.preview]
viewer = "image"

[capabilities.producto]
summary = "Studio product photo of a CAD STL under two area lights with Cycles on the GPU (1200x1200, ~10 s)"
kind = "image"

[capabilities.producto.inputs.part]
type = "path"
required = true
description = "STL (.stl) written by cad.solid beside the piece, resolved relative to the piece file; millimetres, scaled to metres by the runner."

[capabilities.producto.inputs.material]
type = "enum"
values = ["aluminio-cepillado", "acero"]
default = "aluminio-cepillado"
description = "Metal the whole part is dressed in: brushed aluminium (roughness 0.38) or steel (roughness 0.22); both fully metallic."

[capabilities.producto.inputs.backdrop]
type = "enum"
values = ["grafito", "cemento"]
default = "grafito"
description = "Seamless backdrop: graphite (near black) or cement (dark grey); both keep the metal's contrast."

[capabilities.producto.preview]
viewer = "image"

[capabilities.assets]
summary = "Versioned Poly Haven skies, textures and models fetched once into the shared models dir, with a receipt that verify re-checks."
kind = "text"

[capabilities.assets.inputs.name]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"
description = "Asset base name: writes <name>.assets.json, the receipt of every fetched file."

[capabilities.assets.inputs.assets]
type = "array"
required = true
min_items = 1
description = "Poly Haven assets to fetch; one piece carries one fetch list."

[capabilities.assets.inputs.assets.items.id]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9_-]*$"
description = "Poly Haven asset id, the last part of its polyhaven.com URL."

[capabilities.assets.inputs.assets.items.res]
type = "enum"
values = ["1k", "2k", "4k"]
description = "Pinned resolution; the lab default applies when omitted (2k for skies and textures, 1k for models)."

[capabilities.assets.preview]
viewer = "generic"

[capabilities.recorrido]
summary = "Animated camera tour of a CadQuery glTF in Eevee on the GPU (240 frames at 1280x720, 24 fps, ~100 s)"
kind = "video"

[capabilities.recorrido.inputs.model]
type = "path"
required = true
description = "glTF (.glb) exported by cad.solid from a CadQuery Assembly, one element per piece carrying its name, resolved relative to the piece file; never STEP, which Blender does not open without an extra plugin."

[capabilities.recorrido.inputs.azimut]
type = "array"
description = "Azimuth the camera starts and ends at, as one { inicio, fin } item in degrees, measured from +X towards +Y; the lab's orbit when omitted."

[capabilities.recorrido.inputs.azimut.items.inicio]
type = "number"
default = -75
min = -360
max = 360
description = "Azimuth in degrees on the first frame."

[capabilities.recorrido.inputs.azimut.items.fin]
type = "number"
default = -15
min = -360
max = 360
description = "Azimuth in degrees on the last frame."

[capabilities.recorrido.inputs.elevacion]
type = "array"
description = "Elevation the camera starts and ends at, as one { inicio, fin } item in degrees above the floor."

[capabilities.recorrido.inputs.elevacion.items.inicio]
type = "number"
default = 55
min = -89
max = 89
description = "Elevation in degrees on the first frame."

[capabilities.recorrido.inputs.elevacion.items.fin]
type = "number"
default = 40
min = -89
max = 89
description = "Elevation in degrees on the last frame."

[capabilities.recorrido.inputs.distancia]
type = "array"
description = "Distance from the model's centre the camera starts and ends at, as one { inicio, fin } item in metres; the move starts far and comes closer."

[capabilities.recorrido.inputs.distancia.items.inicio]
type = "number"
default = 14.0
min = 0.5
max = 200
description = "Distance in metres on the first frame."

[capabilities.recorrido.inputs.distancia.items.fin]
type = "number"
default = 10.5
min = 0.5
max = 200
description = "Distance in metres on the last frame."

[capabilities.recorrido.inputs.focal]
type = "number"
default = 30
min = 18
max = 100
description = "Lens focal length in millimetres; 30 mm frames the study from 14 m."

[capabilities.recorrido.inputs.seconds]
type = "integer"
default = 10
min = 2
max = 60
description = "Clip length in seconds; the frame count is seconds x fps."

[capabilities.recorrido.inputs.fps]
type = "integer"
default = 24
min = 12
max = 60
description = "Frame rate; the lab's 24 fps plays the orbit smoothly."

[capabilities.recorrido.inputs.seed]
type = "integer"
default = 0
min = 0
description = "Sampling seed; Eevee's render is deterministic, so it only labels the record."

[capabilities.recorrido.inputs.personas-blend]
type = "path"
description = "Prebuilt MPFB collection .blend (one collection per person, the skeleton root at its base), resolved relative to the piece file; the lab builds it once with projects/prueba-render-arq/personas.py. Never generated here."

[capabilities.recorrido.inputs.personas]
type = "array"
default = []
description = "People to stand in the scene, one { nombre, x, y, giro } item each: the collection name in personas-blend and its place in metres. The lab's three placements are the reference example, never a default."

[capabilities.recorrido.inputs.personas.items.nombre]
type = "string"
required = true
description = "Collection name in personas-blend; a name the file does not hold fails the run loudly."

[capabilities.recorrido.inputs.personas.items.x]
type = "number"
required = true
description = "X position in metres, in the scene's own axes; people are never scaled with the model."

[capabilities.recorrido.inputs.personas.items.y]
type = "number"
required = true
description = "Y position in metres, in the scene's own axes."

[capabilities.recorrido.inputs.personas.items.giro]
type = "number"
default = 0
description = "Turn about Z in degrees from the -y facing the collection has by default."

[capabilities.recorrido.inputs.autos-blend]
type = "path"
description = "Prebuilt car-collection .blend (one collection per car hung from an anchor EMPTY at its base centre, facing -y), resolved relative to the piece file; the lab builds it once with projects/prueba-render-arq/autos.py. Never generated here."

[capabilities.recorrido.inputs.autos]
type = "array"
default = []
description = "Cars to park in the scene, one { nombre, x, y, giro } item each: the collection name in autos-blend and its place in metres. The lab's sedan, camioneta and compacto placements are the reference example, never a default."

[capabilities.recorrido.inputs.autos.items.nombre]
type = "string"
required = true
description = "Collection name in autos-blend; a name the file does not hold fails the run loudly."

[capabilities.recorrido.inputs.autos.items.x]
type = "number"
required = true
description = "X position in metres, in the scene's own axes; cars are never scaled with the model."

[capabilities.recorrido.inputs.autos.items.y]
type = "number"
required = true
description = "Y position in metres, in the scene's own axes."

[capabilities.recorrido.inputs.autos.items.giro]
type = "number"
default = 0
description = "Turn about Z in degrees from the -y facing the collection has by default."

[capabilities.recorrido.preview]
viewer = "video"
