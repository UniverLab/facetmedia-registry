name = "bluesky"
version = "0.1.1"
requires_facet = ">=0.1.0b2,<0.2"
protocol = 1
provider = "Bluesky Social PBC · AT Protocol"
tool_name = "Bluesky"
description = "Posts text, images, video and threads to the lab's Bluesky brand account through the AT Protocol, with a read-back check."
facet = "publish"

[engine]
type = "python-env"
python = "3.12"

[transport]
type = "cli"
entry = "runner.py"

[requirements]
gpu = false
ram_gb = 1
disk_gb = 0.2
exclusive = false
platforms = ["linux"]

[[licenses]]
subject = "AT Protocol"
spdx = "MIT"

[[secrets]]
name = "handle"
description = "The brand account's handle, for example lab.example.com (never the password)"
required = true
obtain = "The handle of the brand account you sign in to in a browser"

[[secrets]]
name = "app-password"
description = "The app password created in the account's settings, not the login password"
required = true
obtain = "Created in Settings, Privacy and Security, App passwords in a browser signed in to the brand account"

[capabilities.post]
summary = "Post text with images or video to the lab's Bluesky brand account, one post or a thread, then read it back."
kind = "post"
outward = true

[capabilities.post.i18n.es]
summary = "Publica texto con imágenes o vídeo en la cuenta de Bluesky del laboratorio, un post o un hilo, y lo vuelve a leer."

[capabilities.post.inputs.posts]
type = "array"
required = true
min_items = 1
description = "The posts in thread order; every post after the first is sent as a reply to the previous one."

[capabilities.post.inputs.posts.items.text]
type = "string"
required = true
description = "The post's text, at most 300 graphemes; links, mentions and hashtags become clickable facets."

[capabilities.post.inputs.posts.items.lang]
type = "string"
description = "BCP 47 language tag of the post's text, for example en or es."

[capabilities.post.inputs.posts.items.video]
type = "path"
description = "One video for this post, resolved relative to the piece; refused together with images on the same post."

[capabilities.post.inputs.posts.items.card-url]
type = "string"
description = "Optional external link the post carries as a card, for example https://univerlab.org/placa."

[capabilities.post.inputs.posts.items.card-title]
type = "string"
description = "The card's title, required when card-url is set."

[capabilities.post.inputs.posts.items.card-description]
type = "string"
description = "The card's description, required when card-url is set."

[capabilities.post.inputs.posts.items.card-thumb]
type = "path"
description = "The card's thumbnail image, resolved relative to the piece; warned about when missing."

[capabilities.post.inputs.images]
type = "array"
description = "The images the posts carry, each naming its post by 1-based position; at most four per post, each with alt text."

[capabilities.post.inputs.images.items.post]
type = "integer"
required = true
min = 1
description = "1-based position of the post in posts this image attaches to."

[capabilities.post.inputs.images.items.path]
type = "path"
required = true
description = "The image file, resolved relative to the piece."

[capabilities.post.inputs.images.items.alt]
type = "string"
required = true
description = "The image's alt text; an image without alt text is refused."

[capabilities.post.preview]
viewer = "post"
