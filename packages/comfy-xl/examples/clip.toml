# Needs a 24 GB card: the 14B Wan flow does not fit on a smaller GPU. Replace
# the first frame with your own still and rewrite the prompt for its motion.
capability = "comfy-xl.clip"

[inputs]
workflow = "wan22-i2v-14b"
image = [
  { name = "video-still", image = "video-still.png", seed = 51, width = 1280, height = 704, length = 49, prompt = "Fog drifting slowly between the pine trees at dawn, soft light rays shifting through the mist, very slow camera push in, calm and quiet, cinematic. No lettering or symbols." },
]
