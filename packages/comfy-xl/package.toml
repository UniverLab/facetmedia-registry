[capabilities.still]
summary = "Still illustration with the z-image base flow (~1 min), per 1344x768 image."
kind = "image"

[capabilities.still.i18n.es]
summary = "Ilustración fija con el flujo base z-image (~1 min), por imagen de 1344x768."

[capabilities.still.inputs.image]
type = "array"
required = true
min_items = 1
description = "Images to make; each entry is one prompt with its seed and size."

[capabilities.still.inputs.image.items.name]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"
description = "Asset base name: writes <name>.png."

[capabilities.still.inputs.image.items.prompt]
type = "string"
required = true
pattern = '(?i)^(?!.*\b(?:captions?|chart|graph|labels?|letters?|logo|sign|text|title|words?)\b).*$'
description = "English prompt; illustration, backgrounds or mood only. These words are refused anywhere in it, even negated (\"no text\"): caption, chart, graph, label, letter, logo, sign, text, title, word. Leave them out: the flows draw no lettering."

[capabilities.still.inputs.image.items.seed]
type = "integer"
required = true
description = "Sampling seed; the same seed and prompt give the same image."

[capabilities.still.inputs.image.items.width]
type = "integer"
default = 1344
min = 64
max = 2048
description = "Image width in pixels, a multiple of 64."

[capabilities.still.inputs.image.items.height]
type = "integer"
default = 768
min = 64
max = 2048
description = "Image height in pixels, a multiple of 64."

[capabilities.still.inputs.image.items.steps]
type = "integer"
required = false
min = 1
description = "Sampling steps, overriding the flow's own. Omitting it keeps the flow default (25)."

[capabilities.still.inputs.image.items.cfg]
type = "number"
required = false
min = 0
description = "Classifier-free guidance, overriding the flow's own. Omitting it keeps the flow default (4)."

[capabilities.still.inputs.image.items.sampler]
type = "string"
required = false
description = "Sampler name, overriding the flow's own. Omitting it keeps the flow default (res_multistep)."

[capabilities.still.inputs.image.items.scheduler]
type = "string"
required = false
description = "Scheduler name, overriding the flow's own. Omitting it keeps the flow default (simple)."

[capabilities.still.inputs.image.items.shift]
type = "number"
required = false
min = 0
description = "Model sampling shift, overriding the flow's own. Omitting it keeps the flow default (3)."

[capabilities.still.inputs.workflow]
type = "enum"
values = ["z-image"]
description = "Still flow: z-image is the Z-Image base model at full precision. Omitting it uses z-image."

[capabilities.still.inputs.flow]
type = "path"
required = false
description = "Own flow beside the piece: the package shape (about, params with defaults, graph with $key placeholders; edit and clip flows need uploads). Copy a package flow from packages/comfy-xl/flows/ and change its knobs. Exclusive with workflow; every model file it loads must be one of facet's pinned models."

[capabilities.still.preview]
viewer = "image"

[capabilities.edit]
summary = "Reference-guided edit by instruction with the qwen-image-edit flow, per 1344x768 image."
kind = "image"

[capabilities.edit.i18n.es]
summary = "Edición guiada por referencia según instrucciones con el flujo qwen-image-edit, por imagen de 1344x768."

[capabilities.edit.inputs.source]
type = "path"
required = true
description = "Reference image the edits start from, relative to the piece file."

[capabilities.edit.inputs.image]
type = "array"
required = true
min_items = 1
description = "Edits to make; each entry is one instruction with its seed and size."

[capabilities.edit.inputs.image.items.name]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"
description = "Asset base name: writes <name>.png."

[capabilities.edit.inputs.image.items.prompt]
type = "string"
required = true
pattern = '(?i)^(?!.*\b(?:captions?|chart|graph|labels?|letters?|logo|sign|text|title|words?)\b).*$'
description = "English instruction describing the edit; keeps framing and character, never adds data or lettering. These words are refused anywhere in it, even negated (\"no text\"): caption, chart, graph, label, letter, logo, sign, text, title, word. Leave them out: the flows draw no lettering."

[capabilities.edit.inputs.image.items.seed]
type = "integer"
required = true
description = "Sampling seed; the same seed, prompt and reference image give the same image."

[capabilities.edit.inputs.image.items.width]
type = "integer"
default = 1344
min = 64
max = 2048
description = "Image width in pixels, a multiple of 64."

[capabilities.edit.inputs.image.items.height]
type = "integer"
default = 768
min = 64
max = 2048
description = "Image height in pixels, a multiple of 64."

[capabilities.edit.inputs.image.items.steps]
type = "integer"
required = false
min = 1
description = "Sampling steps, overriding the flow's own. Omitting it keeps the flow default (40)."

[capabilities.edit.inputs.image.items.cfg]
type = "number"
required = false
min = 0
description = "Classifier-free guidance, overriding the flow's own. Omitting it keeps the flow default (4)."

[capabilities.edit.inputs.image.items.sampler]
type = "string"
required = false
description = "Sampler name, overriding the flow's own. Omitting it keeps the flow default (euler)."

[capabilities.edit.inputs.image.items.scheduler]
type = "string"
required = false
description = "Scheduler name, overriding the flow's own. Omitting it keeps the flow default (simple)."

[capabilities.edit.inputs.image.items.shift]
type = "number"
required = false
min = 0
description = "Model sampling shift, overriding the flow's own. Omitting it keeps the flow default (3.1)."

[capabilities.edit.inputs.flow]
type = "path"
required = false
description = "Own flow beside the piece: the package shape (about, params with defaults, graph with $key placeholders; the edit flow needs uploads). Copy packages/comfy-xl/flows/qwen-image-edit.json and change its knobs. Every model file it loads must be one of facet's pinned models."

[capabilities.edit.preview]
viewer = "image"

[capabilities.clip]
summary = "Micro video from a still with the wan22-i2v-14b flow, per 1280x704 clip."
kind = "video"

[capabilities.clip.i18n.es]
summary = "Microvideo a partir de una imagen fija con el flujo wan22-i2v-14b, por clip de 1280x704."

[capabilities.clip.inputs.image]
type = "array"
required = true
min_items = 1
description = "Clips to make; each entry is one first frame with its movement and seed."

[capabilities.clip.inputs.image.items.name]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"
description = "Asset base name: writes <name>.mp4."

[capabilities.clip.inputs.image.items.image]
type = "path"
required = true
description = "First frame of the clip, relative to the piece file; uploaded by the runner."

[capabilities.clip.inputs.image.items.prompt]
type = "string"
required = true
pattern = '(?i)^(?!.*\b(?:captions?|chart|graph|labels?|letters?|logo|sign|text|title|words?)\b).*$'
description = "English prompt describing the movement inside the frame, never data or lettering. These words are refused anywhere in it, even negated (\"no text\"): caption, chart, graph, label, letter, logo, sign, text, title, word. Leave them out: the flows draw no lettering."

[capabilities.clip.inputs.image.items.seed]
type = "integer"
required = true
description = "Sampling seed; the same seed, prompt and first frame give the same clip."

[capabilities.clip.inputs.image.items.width]
type = "integer"
default = 1280
min = 64
max = 2048
description = "Clip width in pixels, a multiple of 64."

[capabilities.clip.inputs.image.items.height]
type = "integer"
default = 704
min = 64
max = 2048
description = "Clip height in pixels, a multiple of 64."

[capabilities.clip.inputs.image.items.length]
type = "integer"
default = 49
description = "Clip length in frames at 24 fps: 49 is about 2 s, 121 about 5 s (4n+1)."

[capabilities.clip.inputs.image.items.negative]
type = "string"
required = false
description = "Custom negative prompt for the clip. Omitting it keeps the flow default (Wan's official Chinese negative). The wan22-i2v-14b-fast flow runs at cfg 1 and ignores the negative."

[capabilities.clip.inputs.image.items.steps]
type = "integer"
required = false
min = 1
description = "Sampling steps, overriding the flow's own. Omitting it keeps the flow default (20 on wan22-i2v-14b, 4 on wan22-i2v-14b-fast)."

[capabilities.clip.inputs.image.items.cfg]
type = "number"
required = false
min = 0
description = "Classifier-free guidance, overriding the flow's own. Omitting it keeps the flow default (5 on wan22-i2v-14b, 1 on wan22-i2v-14b-fast)."

[capabilities.clip.inputs.image.items.sampler]
type = "string"
required = false
description = "Sampler name, overriding the flow's own. Omitting it keeps the flow default (euler)."

[capabilities.clip.inputs.image.items.scheduler]
type = "string"
required = false
description = "Scheduler name, overriding the flow's own. Omitting it keeps the flow default (simple)."

[capabilities.clip.inputs.image.items.shift]
type = "number"
required = false
min = 0
description = "Model sampling shift, overriding the flow's own. Omitting it keeps the flow default (8)."

[capabilities.clip.inputs.workflow]
type = "enum"
values = ["wan22-i2v-14b", "wan22-i2v-14b-fast"]
description = "Clip flow: wan22-i2v-14b animates what is inside the image; wan22-i2v-14b-fast is a draft-only variant that drifts. Omitting it uses wan22-i2v-14b."

[capabilities.clip.inputs.flow]
type = "path"
required = false
description = "Own flow beside the piece: the package shape (about, params with defaults, graph with $key placeholders; the clip flow needs uploads). Copy a package flow from packages/comfy-xl/flows/ and change its knobs. Exclusive with workflow; every model file it loads must be one of facet's pinned models."

[capabilities.clip.preview]
viewer = "video"
