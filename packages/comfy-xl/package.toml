name = "comfy-xl"
version = "0.1.2"
requires_facet = ">=0.1.0b1,<0.2"
protocol = 1
provider = "ComfyUI project"
tool_name = "ComfyUI"
description = "Stills, reference-guided edits and clips with ComfyUI's z-image, qwen-image-edit and wan22-i2v-14b flows, checked by pixel size and video probe (not yet run on a 24 GB GPU)."
facet = "image"
tier_group = "comfy"
tier = "xl"
uses = ["comfyclient"]

[engine]
type = "python-env"
python = "3.12"

[engine.server]
repo = "https://github.com/comfyanonymous/ComfyUI.git"
rev = "3c1b7a17fdf239d35ce98cc777756f572d089795"
requirements = "requirements.txt"
launch = ["python", "main.py", "--listen", "127.0.0.1", "--port", "{{port}}", "--disable-pinned-memory"]
health_url = "http://127.0.0.1:{{port}}/system_stats"

[transport]
type = "cli"
entry = "runner.py"

[requirements]
gpu = true
vram_gb = 24
ram_gb = 32
disk_gb = 95

[[licenses]]
subject = "ComfyUI"
spdx = "GPL-3.0-or-later"

[[licenses]]
subject = "pillow"
spdx = "MIT-CMU"

[[licenses]]
subject = "imageio-ffmpeg"
spdx = "BSD-2-Clause"

