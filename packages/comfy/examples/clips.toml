# Micro videos from approved generated stills: the image is the first frame.
# The prompt describes the movement, in English. 49 frames at 24 fps ≈ 2 s.
# Usage: facet run comfy.clip packages/comfy/examples/clips.toml
# The three approvals (2026-10-14), ~7 minutes per clip with the GPU full:
# pine-fog.mp4 and cup-steam.mp4 work well; the street-watercolor pan
# barely registers (a subtle camera move over a painting does not read;
# for that, a GSAP zoom or pan in HyperFrames takes seconds).
capability = "comfy.clip"

[inputs]
workflow = "wan22-i2v"
image = [
  { name = "pine-fog", image = "z-image-turbo/video-still.png", seed = 51, width = 1280, height = 704, length = 49, prompt = "Fog drifting slowly between the pine trees at dawn, soft light rays shifting through the mist, very slow camera push in, calm and quiet, cinematic. No lettering or symbols." },
  { name = "cup-steam", image = "z-image-turbo/product-photo.png", seed = 52, width = 1280, height = 704, length = 49, prompt = "Steam rising and curling gently from the ceramic coffee cup, soft window light, static camera, shallow depth of field, calm product shot. No lettering or symbols." },
  { name = "street-watercolor", image = "flux2-klein-4b/watercolor.png", seed = 53, width = 1280, height = 704, length = 49, prompt = "Slow camera pan to the right along the colonial street, clouds drifting over the green mountains, engraved illustration style preserved, gentle movement. No lettering or symbols." },
]
