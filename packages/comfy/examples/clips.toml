# Micro videos a partir de imágenes generadas y aprobadas: la image es el primer cuadro.
# El prompt describe el movimiento, en inglés. 49 cuadros a 24 fps ≈ 2 s.
# Uso: facet run comfy.clip packages/comfy/examples/clips.toml
# Los tres aprobados (2026-10-14), ~7 minutos por clip con la GPU llena:
# bosque-niebla.mp4 y taza-vapor.mp4 salen bien; el paneo de calle-acuarela.mp4
# casi no se nota (un movimiento de cámara sutil sobre una pintura no registra;
# para eso, un zoom o paneo con GSAP en HyperFrames sale en seconds).
capability = "comfy.clip"

[inputs]
workflow = "wan22-i2v"
image = [
  { name = "bosque-niebla", image = "z-image-turbo/fondo-video.png", seed = 51, width = 1280, height = 704, length = 49, prompt = "Fog drifting slowly between the pine trees at dawn, soft light rays shifting through the mist, very slow camera push in, calm and quiet, cinematic" },
  { name = "taza-vapor", image = "z-image-turbo/foto-producto.png", seed = 52, width = 1280, height = 704, length = 49, prompt = "Steam rising and curling gently from the ceramic coffee cup, soft window light, static camera, shallow depth of field, calm product shot" },
  { name = "calle-acuarela", image = "flux2-klein-4b/acuarela.png", seed = 53, width = 1280, height = 704, length = 49, prompt = "Slow camera pan to the right along the colonial street, clouds drifting over the green mountains, watercolor painting style preserved, gentle movement" },
]
