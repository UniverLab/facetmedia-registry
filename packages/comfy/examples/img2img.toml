# Img2img with FLUX.2 klein: iterate an approved still by instruction.
# Usage: facet run comfy.edit packages/comfy/examples/img2img.toml
# The flow uploads the reference once and guides each entry with ReferenceLatent.
# It produced print-iteration.png from flux2-klein-4b/editorial-illustration.png
# in 22.7 s at 1344 × 768. It keeps the character and framing and turns the
# image into an indigo-and-cream engraving. The grain and lines are rough, as
# the style asks. Without denoise control: if how much is kept in a gradual
# transformation must be tuned, add a latent img2img flow with adjustable
# denoise and compare it separately.
capability = "comfy.edit"

[inputs]
source = "flux2-klein-4b/editorial-illustration.png"
image = [
  { name = "print-iteration", seed = 242, width = 1344, height = 768, prompt = "Edit the reference image into a two-color linocut print in deep indigo and warm cream. Preserve the woman reading under the desk lamp, the framing, and the large geometric shapes. Use rough carved edges and visible paper grain. Do not add lettering or symbols." },
]
