name = "comfy"
version = "0.1.0"
requires_facet = ">=0.1.0b1,<0.2"
protocol = 1
provider = "ComfyUI project"
tool_name = "ComfyUI"
description = "Stills and reference-guided edits with ComfyUI's z-image-turbo and flux2-klein flows, checked by pixel size."
facet = "image"

[engine]
type = "python-env"
python = "3.12"

[engine.server]
repo = "https://github.com/comfyanonymous/ComfyUI.git"
rev = "3c1b7a17fdf239d35ce98cc777756f572d089795"
requirements = "requirements.txt"
launch = ["python", "main.py", "--listen", "127.0.0.1", "--port", "{{port}}"]
health_url = "http://127.0.0.1:{{port}}/system_stats"

[transport]
type = "cli"
entry = "runner.py"

[requirements]
gpu = true
ram_gb = 16
disk_gb = 25

[[licenses]]
subject = "ComfyUI"
spdx = "GPL-3.0-or-later"

