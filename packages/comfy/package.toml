[capabilities.still]
summary = "Still illustration with the z-image-turbo (~8 s) or flux2-klein-4b (~6 s) flow, per 1344x768 image."
kind = "image"

[capabilities.still.inputs.image]
type = "array"
required = true
min_items = 1
description = "Images to make; each entry is one prompt with its seed and size."

[capabilities.still.inputs.image.items.name]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"
description = "Asset base name: writes <name>.png."

[capabilities.still.inputs.image.items.prompt]
type = "string"
required = true
pattern = '(?i)^(?!.*\b(?:captions?|chart|graph|labels?|letters?|logo|sign|text|title|words?)\b).*$'
description = "English prompt; illustration, backgrounds or mood only. These words are refused anywhere in it, even negated (\"no text\"): caption, chart, graph, label, letter, logo, sign, text, title, word. Leave them out: the flows draw no lettering."

[capabilities.still.inputs.image.items.seed]
type = "integer"
required = true
description = "Sampling seed; the same seed and prompt give the same image."

[capabilities.still.inputs.image.items.width]
type = "integer"
default = 1344
min = 64
max = 2048
description = "Image width in pixels, a multiple of 64."

[capabilities.still.inputs.image.items.height]
type = "integer"
default = 768
min = 64
max = 2048
description = "Image height in pixels, a multiple of 64."

[capabilities.still.inputs.image.items.steps]
type = "integer"
required = false
min = 1
description = "Sampling steps, overriding the flow's own. Omitting it keeps the flow default (8 on z-image-turbo, 4 on flux2-klein-4b)."

[capabilities.still.inputs.image.items.cfg]
type = "number"
required = false
min = 0
description = "Classifier-free guidance, overriding the flow's own. Omitting it keeps the flow default (1)."

[capabilities.still.inputs.image.items.sampler]
type = "string"
required = false
description = "Sampler name, overriding the flow's own. Omitting it keeps the flow default (res_multistep on z-image-turbo, euler on flux2-klein-4b)."

[capabilities.still.inputs.image.items.scheduler]
type = "string"
required = false
description = "Scheduler name, overriding the flow's own. Omitting it keeps the flow default (simple); flux2-klein-4b carries no scheduler, so setting it there fails."

[capabilities.still.inputs.image.items.shift]
type = "number"
required = false
min = 0
description = "Model sampling shift, overriding the flow's own. Omitting it keeps the flow default (3 on z-image-turbo); flux2-klein-4b carries no shift, so setting it there fails."

[capabilities.still.inputs.workflow]
type = "enum"
values = ["z-image-turbo", "flux2-klein-4b"]
description = "Still flow: z-image-turbo for photographic realism, flux2-klein-4b for palette, composition and empty space. Omitting it uses z-image-turbo."

[capabilities.still.inputs.flow]
type = "path"
required = false
description = "Own flow beside the piece: the package shape (about, params with defaults, graph with $key placeholders; edit and clip flows need uploads). Copy a package flow from packages/comfy/flows/ and change its knobs. Exclusive with workflow; every model file it loads must be one of facet's pinned models."

[capabilities.still.preview]
viewer = "image"

[capabilities.edit]
summary = "Reference-guided edit by instruction with the flux2-klein-img2img flow (~23 s), per 1344x768 image."
kind = "image"

[capabilities.edit.inputs.source]
type = "path"
required = true
description = "Reference image the edits start from, relative to the piece file."

[capabilities.edit.inputs.image]
type = "array"
required = true
min_items = 1
description = "Edits to make; each entry is one instruction with its seed and size."

[capabilities.edit.inputs.image.items.name]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"
description = "Asset base name: writes <name>.png."

[capabilities.edit.inputs.image.items.prompt]
type = "string"
required = true
pattern = '(?i)^(?!.*\b(?:captions?|chart|graph|labels?|letters?|logo|sign|text|title|words?)\b).*$'
description = "English instruction describing the edit; keeps framing and character, never adds data or lettering. These words are refused anywhere in it, even negated (\"no text\"): caption, chart, graph, label, letter, logo, sign, text, title, word. Leave them out: the flows draw no lettering."

[capabilities.edit.inputs.image.items.seed]
type = "integer"
required = true
description = "Sampling seed; the same seed, prompt and reference image give the same image."

[capabilities.edit.inputs.image.items.width]
type = "integer"
default = 1344
min = 64
max = 2048
description = "Image width in pixels, a multiple of 64."

[capabilities.edit.inputs.image.items.height]
type = "integer"
default = 768
min = 64
max = 2048
description = "Image height in pixels, a multiple of 64."

[capabilities.edit.inputs.image.items.steps]
type = "integer"
required = false
min = 1
description = "Sampling steps, overriding the flow's own. Omitting it keeps the flow default (4)."

[capabilities.edit.inputs.image.items.cfg]
type = "number"
required = false
min = 0
description = "Classifier-free guidance, overriding the flow's own. Omitting it keeps the flow default (1)."

[capabilities.edit.inputs.image.items.sampler]
type = "string"
required = false
description = "Sampler name, overriding the flow's own. Omitting it keeps the flow default (euler)."

[capabilities.edit.inputs.flow]
type = "path"
required = false
description = "Own flow beside the piece: the package shape (about, params with defaults, graph with $key placeholders; the edit flow needs uploads). Copy packages/comfy/flows/flux2-klein-img2img.json and change its knobs. Every model file it loads must be one of facet's pinned models."

[capabilities.edit.preview]
viewer = "image"

[capabilities.clip]
summary = "Micro video from a still with the wan22-i2v flow (~7 min), per 1280x704 clip."
kind = "video"

[capabilities.clip.inputs.image]
type = "array"
required = true
min_items = 1
description = "Clips to make; each entry is one first frame with its movement and seed."

[capabilities.clip.inputs.image.items.name]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"
description = "Asset base name: writes <name>.mp4."

[capabilities.clip.inputs.image.items.image]
type = "path"
required = true
description = "First frame of the clip, relative to the piece file; uploaded by the runner."

[capabilities.clip.inputs.image.items.prompt]
type = "string"
required = true
pattern = '(?i)^(?!.*\b(?:captions?|chart|graph|labels?|letters?|logo|sign|text|title|words?)\b).*$'
description = "English prompt describing the movement inside the frame, never data or lettering. These words are refused anywhere in it, even negated (\"no text\"): caption, chart, graph, label, letter, logo, sign, text, title, word. Leave them out: the flows draw no lettering."

[capabilities.clip.inputs.image.items.seed]
type = "integer"
required = true
description = "Sampling seed; the same seed, prompt and first frame give the same clip."

[capabilities.clip.inputs.image.items.width]
type = "integer"
default = 1280
min = 64
max = 2048
description = "Clip width in pixels, a multiple of 64."

[capabilities.clip.inputs.image.items.height]
type = "integer"
default = 704
min = 64
max = 2048
description = "Clip height in pixels, a multiple of 64."

[capabilities.clip.inputs.image.items.length]
type = "integer"
default = 49
description = "Clip length in frames at 24 fps: 49 is about 2 s, 121 about 5 s (4n+1)."

[capabilities.clip.inputs.image.items.negative]
type = "string"
required = false
description = "Custom negative prompt for the clip. Omitting it keeps the flow default (Wan's official Chinese negative). The wan22-i2v-fast flow runs at cfg 1 and ignores the negative."

[capabilities.clip.inputs.image.items.steps]
type = "integer"
required = false
min = 1
description = "Sampling steps, overriding the flow's own. Omitting it keeps the flow default (20 on wan22-i2v, 4 on wan22-i2v-fast)."

[capabilities.clip.inputs.image.items.cfg]
type = "number"
required = false
min = 0
description = "Classifier-free guidance, overriding the flow's own. Omitting it keeps the flow default (5 on wan22-i2v, 1 on wan22-i2v-fast)."

[capabilities.clip.inputs.image.items.sampler]
type = "string"
required = false
description = "Sampler name, overriding the flow's own. Omitting it keeps the flow default (uni_pc on wan22-i2v, euler on wan22-i2v-fast)."

[capabilities.clip.inputs.image.items.scheduler]
type = "string"
required = false
description = "Scheduler name, overriding the flow's own. Omitting it keeps the flow default (simple)."

[capabilities.clip.inputs.image.items.shift]
type = "number"
required = false
min = 0
description = "Model sampling shift, overriding the flow's own. Omitting it keeps the flow default (8)."

[capabilities.clip.inputs.workflow]
type = "enum"
values = ["wan22-i2v", "wan22-i2v-fast"]
description = "Clip flow: wan22-i2v animates what is inside the image; wan22-i2v-fast is a draft-only variant that drifts. Omitting it uses wan22-i2v."

[capabilities.clip.inputs.flow]
type = "path"
required = false
description = "Own flow beside the piece: the package shape (about, params with defaults, graph with $key placeholders; the clip flow needs uploads). Copy a package flow from packages/comfy/flows/ and change its knobs. Exclusive with workflow; every model file it loads must be one of facet's pinned models."

[capabilities.clip.preview]
viewer = "video"
