# The same three-slide deck with one speaker note per slide, in page order.
capability = "deck.presenter"

[inputs]
source = "slides.html"
notes = [
  { page = 1, text = "Open with the promise: one capability, one command, one deliverable." },
  { page = 2, text = "Walk through the three commands: copy the example, run it, preview the asset." },
  { page = 3, text = "Close on the point: a working example is the contract a person can read." },
]
