name = "deck"
version = "0.1.0"
requires_facet = ">=0.1.0b1,<0.2"
protocol = 1
provider = "facet"
tool_name = "Deck"
description = "Slide decks authored as HTML with a CSS @page size, exported to a paginated PDF and one PNG per page through the pinned Chromium that `facet pull` installs and the bundled pdf.js"
facet = "presentation"

[browser]
channel = "chromium"
revision = "1254"
version = "158.0.8127.18"
sha256 = "c6cb06e1574ac2f6c5c38e31551157fbcaa67e6366c89974084553c5a5772592"

[engine]
type = "node"

[engine.node]
runtime = "22.21.0"
runtime_sha256 = "262b84b02f7e2bc017d4bdb81fec85ca0d6190a5cd0781d2d6e84317c08871f8"

[[engine.node.packages]]
name = "playwright-core"
version = "1.64.0"
tarball = "https://registry.npmjs.org/playwright-core/-/playwright-core-1.64.0.tgz"
integrity = "sha512-T9r+MZkTECl2+oUcZ26YgZzTrYidTsIhYYkJix+6iDOymOb1FB2RLLSOxRGnZGv5DStt+aduIVbt+E8WygXYpg=="

[[engine.node.packages]]
name = "pdfjs-dist"
version = "3.11.174"
tarball = "https://registry.npmjs.org/pdfjs-dist/-/pdfjs-dist-3.11.174.tgz"
integrity = "sha512-TdTZPf1trZ8/UFu5Cx/GXB7GZM30LT+wWUNfsi6Bq8ePLnb+woNKtDymI2mxZYBpMbonNFqKmiz684DIfnd8dA=="

[transport]
type = "cli"
entry = "runner.js"
invocation_template = "{{node}} {{entry}} {{verb}} --input {{input}} --result {{result}}"

[requirements]
gpu = false
ram_gb = 4
disk_gb = 2
exclusive = false
platforms = ["linux"]

[[licenses]]
subject = "playwright-core"
spdx = "Apache-2.0"

[[licenses]]
subject = "pdfjs-dist"
spdx = "Apache-2.0"

[capabilities.slides]
summary = "Author slides as HTML with a CSS @page size and one page break per slide, exported to a paginated PDF plus one PNG per page"
kind = "document"

[capabilities.slides.inputs.source]
type = "path"
required = true
description = "Slide HTML carrying an @page size and one page break per slide, resolved relative to the piece."

[capabilities.slides.inputs.prompt]
type = "string"
required = true
description = "The brief the deck was authored from; recorded and carried into the document preview."

[capabilities.slides.inputs.seed]
type = "integer"
default = 0
min = 0
description = "Recorded seed; the paginated export is deterministic, so it labels the record."

[capabilities.slides.preview]
viewer = "generic"

[capabilities.page]
summary = "Lay out a one-page infographic or poster from HTML + CSS + SVG, exported to a one-page PDF plus its page PNG through the pinned Chromium's screen-media measured-height render"
kind = "document"

[capabilities.page.inputs.source]
type = "path"
required = true
description = "One-page piece HTML (infographic or poster) with a sources footer and captioned images, resolved relative to the piece."

[capabilities.page.inputs.prompt]
type = "string"
required = true
description = "The brief the piece was authored from; recorded and carried into the document preview."

[capabilities.page.inputs.seed]
type = "integer"
default = 0
min = 0
description = "Recorded seed; the one-page export is deterministic, so it labels the record."

[capabilities.page.preview]
viewer = "generic"

[capabilities.presenter]
summary = "Attach one speaker note per slide and build a self-contained presenter file with speaker view and notes from the same deck"
kind = "document"

[capabilities.presenter.inputs.source]
type = "path"
required = true
description = "Deck HTML with one `<section class=\"slide\">` per slide, resolved relative to the piece; local images and stylesheet refs are inlined as data URIs."

[capabilities.presenter.inputs.notes]
type = "array"
required = true
min_items = 1
description = "One speaker note table per slide; the runner orders them by page and materializes the `---` separated notes companion."

[capabilities.presenter.inputs.notes.items.page]
type = "integer"
required = true
min = 1
description = "1-based slide number the note belongs to; every page must be distinct and inside the deck."

[capabilities.presenter.inputs.notes.items.text]
type = "string"
required = true
description = "Speaker note shown for that slide in the presenter view."

[capabilities.presenter.preview]
viewer = "generic"
