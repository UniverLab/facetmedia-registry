<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Ubuntu'; src: local('Ubuntu'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f3efe6; }
      #root { position: relative; width: 100%; height: 100%; font-family: 'Ubuntu', sans-serif; color: #2b2622; }
      #titulo { position: absolute; left: 120px; top: 120px; font-size: 72px; font-weight: 500; letter-spacing: -0.02em; }
      #contador { position: absolute; left: 120px; top: 260px; font-size: 160px; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080" data-fps="24">
      <h1 id="titulo" class="clip" data-start="0" data-duration="3" data-track-index="0">HyperFrames</h1>
      <p id="contador" class="clip" data-start="0" data-duration="3" data-track-index="1">0</p>
    </div>
    <script>
      // One paused timeline on window.__timelines, keyed by data-composition-id.
      // The counter tweens textContent with snap: the render seeks each frame.
      const tl = gsap.timeline({ paused: true });
      tl.from('#titulo', { opacity: 0, y: 24, duration: 0.6 }, 0);
      tl.to('#contador', { textContent: 42, snap: { textContent: 1 }, duration: 2 }, 0.4);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
