[inputs]
composition = "diagram/composition"
diagram-svg = "diagram/diagram.svg"
prompt = "Draw a small Mermaid flow diagram node by node"
seed = 0
fps = 24

[[inputs.animation]]
selector = '[id^="my-svg-flowchart-datos-"]'
at = 0.4
kind = "show"

[[inputs.animation]]
selector = "#my-svg-L_datos_pieza_0"
at = 0.9
kind = "draw"
dur = 0.5

[[inputs.animation]]
selector = '.edgeLabels [data-id="L_datos_pieza_0"]'
at = 1.2
kind = "fade"
dur = 0.3

[[inputs.animation]]
selector = "#my-svg-service-agente"
at = 1.6
kind = "show"

[[inputs.animation]]
selector = "#my-svg-group-lab"
at = 1.9
kind = "fade"

[[inputs.animation]]
selector = "#my-svg-gpu"
at = 2.3
kind = "fade"
