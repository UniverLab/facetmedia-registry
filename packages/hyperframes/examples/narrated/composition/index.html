<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Old Standard TT'; src: url('./assets/fonts/OldStandard-Regular.ttf'); font-weight: 400; }
      @font-face { font-family: 'EB Garamond'; src: url('./assets/fonts/EBGaramond[wght].ttf'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #222928; }
      #root { position: relative; width: 100%; height: 100%; font-family: 'EB Garamond', serif; color: #ecebe4; }
      #title { position: absolute; left: 120px; top: 120px; font-size: 72px; font-weight: 400; font-family: 'Old Standard TT', serif; }
      .sub { position: absolute; left: 160px; right: 160px; bottom: 80px; opacity: 0; text-align: center; font-size: 44px; line-height: 1.25; color: #b9bdb5; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080" data-fps="24">
      <h1 id="title" class="clip" data-start="0" data-duration="5" data-track-index="0">Narrated</h1>
      <!-- SUBS -->
      <!-- AUDIOS -->
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from('#title', { opacity: 0, y: 20, duration: 0.5 }, 0);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
