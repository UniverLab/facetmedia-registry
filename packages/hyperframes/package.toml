spdx = "Apache-2.0"

[[licenses]]
subject = "esbuild"
spdx = "MIT"

[[licenses]]
subject = "puppeteer-core"
spdx = "Apache-2.0"

[[licenses]]
subject = "FFmpeg (BtbN static build)"
spdx = "GPL-3.0-or-later"

[capabilities.render]
summary = "Render a checked HTML+GSAP composition to an MP4 with the pinned HyperFrames CLI"
kind = "video"

[capabilities.render.i18n.es]
summary = "Renderiza una composición HTML+GSAP verificada a MP4 con el CLI fijado de HyperFrames"

[capabilities.render.inputs.composition]
type = "path"
required = true
description = "Composition directory with hyperframes.json and index.tmpl (never named .html, which HyperFrames reads as a second composition) plus build.mjs and assets/, resolved relative to the piece; self-contained, vendoring every asset instead of loading a remote URL."

[capabilities.render.inputs.audio]
type = "array"
default = []
description = "Audio clips entering the composition as <audio>, one { clip } item each; each clip is copied into the composition directory by its file name."

[capabilities.render.inputs.audio.items.clip]
type = "path"
required = true
description = "Voice, music or effect clip, resolved relative to the piece file and copied into the composition directory by its file name."

[capabilities.render.inputs.prompt]
type = "string"
required = true
description = "The brief the composition was authored from; recorded and carried into the video preview."

[capabilities.render.inputs.seed]
type = "integer"
default = 0
min = 0
description = "Recorded seed; the seek-based timeline renders deterministically, so it labels the record."

[capabilities.render.inputs.fps]
type = "integer"
min = 1
description = "Frame rate passed as --fps; the composition's own data-fps applies when omitted."

[capabilities.render.preview]
viewer = "video"

[capabilities.loop]
summary = "Render a checked HTML+GSAP composition to a looping GIF or a MOV with alpha, from the same source as the MP4"
kind = "video"

[capabilities.loop.i18n.es]
summary = "Renderiza una composición HTML+GSAP verificada a un GIF en bucle o un MOV con alfa, desde la misma fuente que el MP4"

[capabilities.loop.inputs.composition]
type = "path"
required = true
description = "Composition directory with hyperframes.json and index.tmpl (never named .html, which HyperFrames reads as a second composition) plus build.mjs and assets/, resolved relative to the piece; self-contained, vendoring every asset instead of loading a remote URL."

[capabilities.loop.inputs.audio]
type = "array"
default = []
description = "Audio clips entering the composition as <audio>, one { clip } item each; each clip is copied into the composition directory by its file name."

[capabilities.loop.inputs.audio.items.clip]
type = "path"
required = true
description = "Voice, music or effect clip, resolved relative to the piece file and copied into the composition directory by its file name."

[capabilities.loop.inputs.prompt]
type = "string"
required = true
description = "The brief the composition was authored from; recorded and carried into the video preview."

[capabilities.loop.inputs.seed]
type = "integer"
default = 0
min = 0
description = "Recorded seed; the seek-based timeline renders deterministically, so it labels the record."

[capabilities.loop.inputs.fps]
type = "integer"
min = 1
description = "Frame rate passed as --fps; the composition's own data-fps applies when omitted."

[capabilities.loop.inputs.format]
type = "enum"
values = ["gif", "mov-alpha"]
required = true
description = "gif renders a looping animation for feeds and embeds; mov-alpha renders a QuickTime MOV with an alpha channel for overlays on other footage."

[capabilities.loop.preview]
viewer = "video"

[capabilities.diagram]
summary = "Render a Mermaid SVG inside a checked HTML+GSAP composition, drawn by a validated GSAP timeline"
kind = "video"

[capabilities.diagram.i18n.es]
summary = "Renderiza un SVG de Mermaid dentro de una composición HTML+GSAP verificada, dibujado por una línea de tiempo GSAP validada"

[capabilities.diagram.inputs.composition]
type = "path"
required = true
description = "Composition directory with hyperframes.json and index.tmpl (never named .html, which HyperFrames reads as a second composition) plus build.mjs and assets/, resolved relative to the piece; self-contained, vendoring every asset instead of loading a remote URL."

[capabilities.diagram.inputs.prompt]
type = "string"
required = true
description = "The brief the composition was authored from; recorded and carried into the video preview."

[capabilities.diagram.inputs.seed]
type = "integer"
default = 0
min = 0
description = "Recorded seed; the seek-based timeline renders deterministically, so it labels the record."

[capabilities.diagram.inputs.fps]
type = "integer"
min = 1
description = "Frame rate passed as --fps; the composition's own data-fps applies when omitted."

[capabilities.diagram.inputs.diagram-svg]
type = "path"
required = true
description = "Mermaid SVG file as produced by tools/mermaid.sh (for example cycle.svg or architecture.svg), resolved relative to the piece; the runner inserts it at `<!-- DIAGRAM -->` in index.html, decoding `&gt;` inside `<style>` and stripping xmlns attributes."

[capabilities.diagram.inputs.animation]
type = "array"
default = []
description = "Ordered timeline steps drawing the diagram; each step names a selector from the diagram's stable Mermaid ids, the second it starts at, and what it does."

[capabilities.diagram.inputs.animation.items.selector]
type = "string"
required = true
description = "CSS selector into the Mermaid SVG; validated against the ids and data-ids the SVG actually carries before any render."

[capabilities.diagram.inputs.animation.items.at]
type = "number"
required = true
description = "Second on the composition timeline at which the step starts."

[capabilities.diagram.inputs.animation.items.kind]
type = "enum"
values = ["show", "draw", "fade"]
required = true
description = "show pops a node in, draw traces an edge with strokeDashoffset, fade dissolves a group or label."

[capabilities.diagram.inputs.animation.items.dur]
type = "number"
default = 0.4
description = "Step duration in seconds."

[capabilities.diagram.preview]
viewer = "video"

[capabilities.turntable]
summary = "Render a checked Three.js composition that turns an embedded CAD model on a camera orbit, without Cycles frame runs"
kind = "video"

[capabilities.turntable.i18n.es]
summary = "Renderiza una composición Three.js verificada que gira un modelo CAD incrustado en una órbita de cámara, sin pasadas de fotogramas Cycles"

[capabilities.turntable.inputs.composition]
type = "path"
required = true
description = "Composition directory with hyperframes.json and index.tmpl plus assets/ and vendor/ (pinned gsap.min.js, three.module.js and three/addons/GLTFLoader.js), resolved relative to the piece; the author's offline build.mjs produces the vendored tree and the runner never executes it."

[capabilities.turntable.inputs.model-glb]
type = "path"
required = true
description = "CAD model as a .glb file, resolved relative to the piece file; base64-embedded into the composition's GLB placeholder before check so nothing is fetched at render time."

[capabilities.turntable.inputs.orbit-radius]
type = "number"
default = 9
description = "Camera orbit radius around the model, in scene units."

[capabilities.turntable.inputs.orbit-height]
type = "number"
default = 11
description = "Camera height above the scene floor, in scene units."

[capabilities.turntable.inputs.orbit-start]
type = "number"
default = -0.9
description = "Starting angle of the orbit, in radians."

[capabilities.turntable.inputs.orbit-fraction]
type = "number"
default = 0.55
description = "Fraction of a full turn the camera completes over duration."

[capabilities.turntable.inputs.center-x]
type = "number"
default = 3.0
description = "X of the model centre the camera looks at."

[capabilities.turntable.inputs.center-y]
type = "number"
default = 0.6
description = "Y (height) of the model centre the camera looks at."

[capabilities.turntable.inputs.center-z]
type = "number"
default = -2.25
description = "Z of the model centre the camera looks at; glTF is Y-up, so this is the negated floor-plane Y."

[capabilities.turntable.inputs.duration]
type = "number"
default = 8
description = "Composition length in seconds; renderAt(t) maps the orbit over this span."

[capabilities.turntable.inputs.prompt]
type = "string"
required = true
description = "The brief the composition was authored from; recorded and carried into the video preview."

[capabilities.turntable.inputs.seed]
type = "integer"
default = 0
min = 0
description = "Recorded seed; the seek-based render is deterministic, so it labels the record."

[capabilities.turntable.inputs.fps]
type = "integer"
min = 1
description = "Frame rate passed as --fps; the composition's own data-fps applies when omitted."

[capabilities.turntable.preview]
viewer = "video"

[capabilities.character]
summary = "Speak a drawn SVG character with Rhubarb mouth cues timed to the voice"
kind = "video"

[capabilities.character.i18n.es]
summary = "Da voz a un personaje SVG dibujado con pistas de boca Rhubarb sincronizadas con la voz"

[capabilities.character.inputs.composition]
type = "path"
required = true
description = "Composition directory with hyperframes.json and index.tmpl plus assets/ and vendor/, resolved relative to the piece; the piece author's offline build.mjs produces this tree and the runner never executes it."

[capabilities.character.inputs.character-svg]
type = "path"
required = true
description = "Character SVG with one .mouth shape per Rhubarb letter, ids mouth-X..H, resolved relative to the piece; the CSS rest rule keeps #mouth-X visible at frame 0."

[capabilities.character.inputs.voice]
type = "path"
required = true
description = "Voice audio resolved relative to the piece, copied into the composition root and referenced by its plain name."

[capabilities.character.inputs.mouths]
type = "path"
required = true
description = "mouths.json produced offline with the upstream Rhubarb CLI (rhubarb -r phonetic -f json --dialogFile <text> <voice> -o mouths.json), resolved relative to the piece."

[capabilities.character.inputs.audio-start]
type = "number"
default = 0.5
description = "Shift applied to every mouth cue, matching the audio element's data-start."

[capabilities.character.inputs.target-lufs]
type = "number"
default = -14.0
min = -24
max = -9
description = "Integrated loudness the runner brings the finished video to with two-pass EBU R128 loudnorm at true peak -1.0 dBTP; verify checks the result within ±1 LU with true peak at or below -0.5 dBTP."

[capabilities.character.inputs.prompt]
type = "string"
required = true
description = "The brief the composition was authored from; recorded and carried into the video preview."

[capabilities.character.inputs.seed]
type = "integer"
default = 0
min = 0
description = "Recorded seed; the seek-based timeline renders deterministically, so it labels the record."

[capabilities.character.inputs.fps]
type = "integer"
min = 1
description = "Frame rate passed as --fps; the composition's own data-fps applies when omitted."

[capabilities.character.preview]
viewer = "video"

[capabilities.narrated]
summary = "Assemble a narrated piece: voice clips, a music bed and whisper subtitles on one checked HyperFrames timeline"
kind = "video"

[capabilities.narrated.i18n.es]
summary = "Ensambla una pieza narrada: clips de voz, una base musical y subtítulos whisper en una línea de tiempo HyperFrames verificada"

[capabilities.narrated.inputs.composition]
type = "path"
required = true
description = "Composition directory with hyperframes.json, index.tmpl plus assets/ and vendor/, resolved relative to the piece; the author's offline build.mjs produces the vendored tree and the runner never executes it. index.tmpl carries one <!-- SUBS --> marker, one <!-- AUDIOS --> marker and a positive data-duration on the data-composition-id tag. The author's offline build.mjs writes those markers into index.html, and the runner injects into the copied index.html, the file HyperFrames renders."

[capabilities.narrated.inputs.voice]
type = "array"
required = true
min_items = 1
description = "Voice files from voicestudio, one { clip } item each; voicestudio keeps one engine per file, so narrator and clone voices arrive as separate clips. Every clip must resolve relative to the piece; the runner copies them into the composition root and never probes audio provenance."

[capabilities.narrated.inputs.voice.items.clip]
type = "path"
required = true
description = "Voice clip copied into the composition root and injected as <audio id=\"voice-N\" src=\"<name>\">."

[capabilities.narrated.inputs.voice.items.start]
type = "number"
default = 0
min = 0
description = "Seconds on the composition timeline where this clip starts."

[capabilities.narrated.inputs.music]
type = "path"
required = true
description = "Instrumental music bed already mixed offline with the ffmpeg package, resolved relative to the piece and copied into the composition root as <audio id=\"music\">."

[capabilities.narrated.inputs.subtitles]
type = "path"
required = true
description = "SubRip .srt written offline by whisper transcribe, resolved relative to the piece; parsed into burned-in subtitle cues that must end inside the composition duration."

[capabilities.narrated.inputs.music-volume]
type = "number"
default = 0.25
min = 0
max = 1
description = "The bed's `data-volume` under the voices, where 0.25 is about −12 dB."

[capabilities.narrated.inputs.target-lufs]
type = "number"
default = -14.0
min = -24
max = -9
description = "Integrated loudness the runner brings the finished video to with two-pass EBU R128 loudnorm at true peak -1.0 dBTP; verify checks the result within ±1 LU with true peak at or below -0.5 dBTP."

[capabilities.narrated.inputs.prompt]
type = "string"
required = true
description = "The brief the composition was authored from; recorded and carried into the video preview."

[capabilities.narrated.inputs.seed]
type = "integer"
default = 0
min = 0
description = "Recorded seed; the seek-based timeline renders deterministically, so it labels the record."

[capabilities.narrated.inputs.fps]
type = "integer"
min = 1
description = "Frame rate passed as --fps; the composition's own data-fps applies when omitted."

[capabilities.narrated.preview]
viewer = "video"
