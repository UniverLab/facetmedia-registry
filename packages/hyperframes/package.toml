[transport]
type = "cli"
entry = "runner.js"
invocation_template = "{{node}} {{entry}} {{verb}} --input {{input}} --result {{result}}"

[requirements]
gpu = false
ram_gb = 4
disk_gb = 2
exclusive = true
platforms = ["linux"]

[[licenses]]
subject = "hyperframes"
spdx = "Apache-2.0"

