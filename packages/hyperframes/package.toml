[transport]
type = "cli"
entry = "runner.js"
invocation_template = "{{node}} {{entry}} {{verb}} --input {{input}} --result {{result}}"

[requirements]
gpu = false
ram_gb = 4
disk_gb = 2
exclusive = true
platforms = ["linux"]

[[licenses]]
subject = "hyperframes"
spdx = "Apache-2.0"

[[licenses]]
subject = "sharp"
spdx = "Apache-2.0"

[[licenses]]
subject = "esbuild"
spdx = "MIT"

[[licenses]]
subject = "puppeteer-core"
spdx = "Apache-2.0"

[capabilities.render]
summary = "Render a checked HTML+GSAP composition to an MP4 with the pinned HyperFrames CLI"
kind = "video"

[capabilities.render.inputs.composicion]
type = "path"
required = true
description = "Composition directory with hyperframes.json and index.tmpl (never named .html, which HyperFrames reads as a second composition) plus build.mjs and assets/, resolved relative to the piece; self-contained, vendoring every asset instead of loading a remote URL."

[capabilities.render.inputs.audio]
type = "array"
default = []
description = "Audio clips entering the composition as <audio>, one { clip } item each; each clip is copied into the composition directory by its file name."

[capabilities.render.inputs.audio.items.clip]
type = "path"
required = true
description = "Voice, music or effect clip to place beside the composition, resolved relative to the piece file."

[capabilities.render.inputs.prompt]
type = "string"
required = true
description = "The brief the composition was authored from; recorded and carried into the video preview."

[capabilities.render.inputs.seed]
type = "integer"
default = 0
min = 0
description = "Recorded seed; the seek-based timeline renders deterministically, so it labels the record."

[capabilities.render.inputs.fps]
type = "integer"
min = 1
description = "Frame rate passed as --fps; the composition's own data-fps applies when omitted."

[capabilities.render.preview]
viewer = "video"
