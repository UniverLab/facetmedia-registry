[capabilities.speak]
summary = "Narration from text on CPU (Spanish and English), checked by transcription"
kind = "audio"

[capabilities.speak.inputs.voice]
type = "enum"
values = [
  "ef_dora",
  "em_alex",
  "em_santa",
  "af_alloy",
  "af_aoede",
  "af_bella",
  "af_heart",
  "af_jessica",
  "af_kore",
  "af_nicole",
  "af_nova",
  "af_river",
  "af_sarah",
  "af_sky",
  "am_adam",
  "am_echo",
  "am_eric",
  "am_fenrir",
  "am_liam",
  "am_michael",
  "am_onyx",
  "am_puck",
  "am_santa",
  "bf_alice",
  "bf_emma",
  "bf_isabella",
  "bf_lily",
  "bm_daniel",
  "bm_fable",
  "bm_george",
  "bm_lewis",
]
default = "ef_dora"
description = "Kokoro voice; its first letter must match language (e → es, a → en-us, b → en-gb)."

[capabilities.speak.inputs.language]
type = "enum"
values = ["es", "en-us", "en-gb"]
default = "es"
description = "Narration language."

[capabilities.speak.inputs.speed]
type = "number"
default = 1.0
min = 0.5
max = 2.0
description = "Speaking rate."

[capabilities.speak.inputs.target-lufs]
type = "number"
default = -16.0
min = -30
max = -10
description = "Normalisation target in LUFS, capped so the peak stays at or below -1.0 dBFS."

[capabilities.speak.inputs.clip]
type = "array"
min_items = 1
required = true
description = "Clips to narrate; each writes <name>.wav."

[capabilities.speak.inputs.clip.items.name]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"
description = "Asset base name."

[capabilities.speak.inputs.clip.items.text]
type = "string"
required = true
description = "Narration text."

[capabilities.speak.inputs.clip.items.voice]
type = "enum"
values = [
  "ef_dora",
  "em_alex",
  "em_santa",
  "af_alloy",
  "af_aoede",
  "af_bella",
  "af_heart",
  "af_jessica",
  "af_kore",
  "af_nicole",
  "af_nova",
  "af_river",
  "af_sarah",
  "af_sky",
  "am_adam",
  "am_echo",
  "am_eric",
  "am_fenrir",
  "am_liam",
  "am_michael",
  "am_onyx",
  "am_puck",
  "am_santa",
  "bf_alice",
  "bf_emma",
  "bf_isabella",
  "bf_lily",
  "bm_daniel",
  "bm_fable",
  "bm_george",
  "bm_lewis",
]
description = "Voice for this clip; overrides the piece voice."

[capabilities.speak.inputs.clip.items.speed]
type = "number"
min = 0.5
max = 2.0
description = "Speed for this clip; overrides the piece speed."

[capabilities.speak.verify]
thresholds = { wer_max = 0.05 }

[capabilities.speak.preview]
viewer = "audio"
