name = "kokoro"
version = "0.1.0"
requires_facet = ">=0.1.0b1,<0.2"
protocol = 1
provider = "hexgrad (model) · thewh1teagle (kokoro-onnx)"
tool_name = "Kokoro TTS (kokoro-onnx)"
description = "Narration from text on CPU (Spanish and English), checked by transcription"
facet = "voice"

[engine]
type = "python-env"
python = "3.12"

[transport]
type = "cli"
entry = "runner.py"

[requirements]
gpu = false
ram_gb = 4
disk_gb = 1.5
exclusive = true
platforms = ["linux"]

