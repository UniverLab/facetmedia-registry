[transport]
type = "cli"
entry = "runner.js"
invocation_template = "{{node}} {{entry}} {{verb}} --input {{input}} --result {{result}}"

[requirements]
gpu = false
ram_gb = 4
disk_gb = 2
exclusive = true
platforms = ["linux"]

[[licenses]]
subject = "mermaid-cli"
spdx = "MIT"

[capabilities.diagrama]
summary = "Render a .mmd Mermaid diagram to SVG and PNG with the pinned mermaid-cli and the pinned Chromium that `facet pull` installs"
kind = "image"

[capabilities.diagrama.inputs.diagrama]
type = "path"
required = true
description = "Mermaid diagram file (.mmd) with its YAML header (theme, themeVariables, fontFamily, fontSize), resolved relative to the piece; flowchart, architecture-beta and the other Mermaid types."

[capabilities.diagrama.preview]
viewer = "image"
