name = "pdf-ops"
version = "0.1.0"
requires_facet = ">=0.1.0b2,<0.2"
protocol = 1
provider = "pikepdf · pypdfium2"
tool_name = "PDF Ops"
description = "Deterministic CPU PDF manipulation with pikepdf and pypdfium2: merge PDFs in order, split page ranges, recompress and linearize, and rasterize pages to PNGs for visual inspection"
facet = "text"

[engine]
type = "python-env"
python = "3.12"

[transport]
type = "cli"
entry = "runner.py"

[requirements]
gpu = false
ram_gb = 1
disk_gb = 0.2
exclusive = false
platforms = ["linux"]

[[licenses]]
subject = "pikepdf"
spdx = "MPL-2.0"

[[licenses]]
subject = "pypdfium2"
spdx = "Apache-2.0"

[[licenses]]
subject = "pillow"
spdx = "MIT-CMU"

[capabilities.merge]
summary = "Combine two or more PDFs into one PDF, in the given order"
kind = "document"

[capabilities.merge.i18n.es]
summary = "Combina dos o más PDF en un solo PDF, en el orden dado"

[capabilities.merge.inputs.pdf]
type = "array"
min_items = 2
required = true
description = "PDFs to combine in order; each writes its pages into <name>.pdf."

[capabilities.merge.inputs.pdf.items.path]
type = "path"
required = true
description = "Source PDF resolved relative to the piece file."

[capabilities.merge.inputs.name]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"
description = "Asset base name; writes <name>.pdf."

[capabilities.merge.preview]
viewer = "document"

[capabilities.split]
summary = "Extract a page range or selection from a PDF into a new PDF"
kind = "document"

[capabilities.split.i18n.es]
summary = "Extrae un rango o selección de páginas de un PDF en un PDF nuevo"

[capabilities.split.inputs.pdf]
type = "path"
required = true
description = "Source PDF resolved relative to the piece file."

[capabilities.split.inputs.pages]
type = "string"
required = true
description = "Pages to keep, 1-based inclusive, e.g. 1-3,5."

[capabilities.split.inputs.name]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"
description = "Asset base name; writes <name>.pdf."

[capabilities.split.preview]
viewer = "document"

[capabilities.compress]
summary = "Recompress a PDF's streams and linearize it for fast web viewing"
kind = "document"

[capabilities.compress.i18n.es]
summary = "Recomprime los flujos de un PDF y lo linealiza para una vista web rápida"

[capabilities.compress.inputs.pdf]
type = "path"
required = true
description = "Source PDF resolved relative to the piece file."

[capabilities.compress.inputs.name]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"
description = "Asset base name; writes <name>.pdf."

[capabilities.compress.preview]
viewer = "document"

[capabilities.rasterize]
summary = "Render PDF pages to PNGs for visual inspection"
kind = "image"

[capabilities.rasterize.i18n.es]
summary = "Convierte las páginas de un PDF en PNG para inspección visual"

[capabilities.rasterize.inputs.pdf]
type = "path"
required = true
description = "Source PDF resolved relative to the piece file."

[capabilities.rasterize.inputs.name]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"
description = "Asset base name; writes <name>-page-01.png, etc."

[capabilities.rasterize.inputs.pages]
type = "string"
required = false
description = "Pages to render, 1-based inclusive, e.g. 1-3,5; renders every page when omitted."

[capabilities.rasterize.inputs.dpi]
type = "integer"
default = 150
min = 72
max = 300
description = "Render resolution in dots per inch."

[capabilities.rasterize.preview]
viewer = "image"
