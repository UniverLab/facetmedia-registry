name = "pillow"
version = "0.2.0"
requires_facet = ">=0.1.0b1,<0.2"
protocol = 1
provider = "Jeffrey A. Clark and contributors (Pillow)"
tool_name = "Pillow"
description = "Base image operations and photo retouching on CPU with Pillow: convert, resize, contact sheets, aspect cropping, color grading, sharpening, and framing"
facet = "image"

[engine]
type = "python-env"
python = "3.12"

[transport]
type = "cli"
entry = "runner.py"

[requirements]
gpu = false
ram_gb = 1
disk_gb = 0.2
exclusive = false
platforms = ["linux"]

[[licenses]]
subject = "pillow"
spdx = "MIT-CMU"

[capabilities.base]
summary = "Convert a still between PNG, JPEG and WebP, resize it exact or aspect-preserving, or lay a contact sheet of it, one op per table applied in order"
kind = "image"

[capabilities.base.i18n.es]
summary = "Convierte una imagen fija entre PNG, JPEG y WebP, la redimensiona exacta o con proporción, o arma una hoja de contactos, una op por tabla aplicada en orden"

[capabilities.base.inputs.image]
type = "path"
required = true
description = "Source image (PNG, JPEG, WebP or any Pillow-readable format), resolved relative to the piece file; every op applies to it in order and writes <image-stem>-<i>-<op>.<ext> beside the piece."

[capabilities.base.inputs.operations]
type = "array"
min_items = 1
required = true
description = "One table per operation, applied in order in memory starting from image; each writes one file named <image-stem>-<i>-<op>.<ext> where i is the 1-based op position."

[capabilities.base.inputs.operations.items.op]
type = "enum"
values = ["convert", "resize", "sheet"]
required = true
description = "The operation: convert re-encodes the format, resize resizes, sheet lays a contact sheet."

[capabilities.base.inputs.operations.items.format]
type = "enum"
values = ["png", "jpeg", "webp"]
description = "convert only, required there: the output format; writes .png, .jpg or .webp."

[capabilities.base.inputs.operations.items.mode]
type = "enum"
values = ["RGB", "RGBA", "L"]
description = "convert only: the output mode; jpeg output is always RGB, and RGBA with jpeg is rejected."

[capabilities.base.inputs.operations.items.width]
type = "integer"
min = 1
description = "resize only: target width; with height it resizes exact (aspect may change), alone it preserves aspect."

[capabilities.base.inputs.operations.items.height]
type = "integer"
min = 1
description = "resize only: target height; at least one of width or height is required."

[capabilities.base.inputs.operations.items.columns]
type = "integer"
min = 1
description = "sheet only, required there: number of tile columns."

[capabilities.base.inputs.operations.items.rows]
type = "integer"
min = 1
description = "sheet only, required there: number of tile rows."

[capabilities.base.preview]
viewer = "image"

[capabilities.retouch]
summary = "Retouch a photo on CPU with deterministic crop, flip, rotate, autocontrast, color grading, sharpening, and editorial border framing"
kind = "image"

[capabilities.retouch.i18n.es]
summary = "Retoca una foto en CPU con recorte de proporción, volteo, rotación, autocontraste, ajuste de color, enfoque y marco editorial"

[capabilities.retouch.inputs.image]
type = "path"
required = true
description = "Source photo (PNG, JPEG, WebP or any Pillow-readable format), resolved relative to the piece file; EXIF orientation is applied on open."

[capabilities.retouch.inputs.name]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"
description = "Output asset base name; writes <name>.<ext> beside the piece."

[capabilities.retouch.inputs.format]
type = "enum"
values = ["png", "jpeg", "webp"]
default = "png"
description = "Output format; writes .png, .jpg or .webp."

[capabilities.retouch.inputs.aspect]
type = "enum"
values = ["1:1", "4:5", "16:9", "9:16", "3:2", "4:3"]
description = "Optional aspect ratio for center-cropping without stretching."

[capabilities.retouch.inputs.rotate-deg]
type = "number"
default = 0.0
min = -180
max = 180
description = "Counter-clockwise rotation in degrees (expands canvas when non-zero)."

[capabilities.retouch.inputs.flip]
type = "enum"
values = ["none", "horizontal", "vertical"]
default = "none"
description = "Mirror the image horizontally or vertically before rotation."

[capabilities.retouch.inputs.autocontrast]
type = "boolean"
default = false
description = "Apply ImageOps.autocontrast(cutoff=1) to RGB channels."

[capabilities.retouch.inputs.brightness]
type = "number"
default = 1.0
min = 0.2
max = 3.0
description = "Brightness multiplier (1.0 is unchanged)."

[capabilities.retouch.inputs.contrast]
type = "number"
default = 1.0
min = 0.2
max = 3.0
description = "Contrast multiplier (1.0 is unchanged)."

[capabilities.retouch.inputs.saturation]
type = "number"
default = 1.0
min = 0.0
max = 3.0
description = "Color saturation multiplier (1.0 is unchanged, 0.0 is grayscale)."

[capabilities.retouch.inputs.warmth]
type = "number"
default = 0.0
min = -1.0
max = 1.0
description = "White-balance warmth shift (-1.0 cooler to 1.0 warmer)."

[capabilities.retouch.inputs.sharpen]
type = "number"
default = 0.0
min = 0.0
max = 3.0
description = "Unsharp-mask sharpening amount (0.0 disables sharpening)."

[capabilities.retouch.inputs.pad-px]
type = "integer"
default = 0
min = 0
max = 400
description = "Uniform border padding in pixels around the finished photo."

[capabilities.retouch.inputs.pad-color]
type = "string"
default = "#F6F3EC"
description = "Hex color used for border padding when pad-px > 0 (and JPEG alpha flattening when pad-px > 0)."

[capabilities.retouch.preview]
viewer = "image"
