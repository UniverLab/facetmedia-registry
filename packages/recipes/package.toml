name = "recipes"
version = "0.1.1"
requires_facet = ">=0.1.0b1,<0.2"
protocol = 1
provider = "UniverLab (recipes)"
tool_name = "recipes"
description = "Complete-piece recipes that chain existing packages into ordered plans: the narrated explainer video, the architectural render, voiced material with music and the tool demo"
facet = "text"

[engine]
type = "python-env"
python = "3.12"

[transport]
type = "cli"
entry = "runner.py"

[requirements]
gpu = false
ram_gb = 1
disk_gb = 0.1
exclusive = false
platforms = ["linux"]

[[licenses]]
subject = "recipes"
spdx = "MIT"

[capabilities.plan]
summary = "Write an ordered plan for one complete piece, one step per capability to run with its handoff files and its verification"
kind = "text"

[capabilities.plan.inputs.recipe]
type = "enum"
values = ["explainer-video", "architecture-render", "voice-material", "tool-demo"]
required = true
description = "Complete piece to plan: explainer-video (narrated explainer video), architecture-render (architectural render), voice-material (voiced material with music) or tool-demo (tool demo). The plan is written as <recipe>.plan.json beside the piece."

[capabilities.plan.verify]
thresholds = { steps_min = 1 }

[capabilities.plan.preview]
viewer = "generic"
