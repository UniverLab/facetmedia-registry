name = "svganim"
version = "0.1.3"
requires_facet = ">=0.1.0b1,<0.2"
protocol = 1
provider = "UniverLab (svganim)"
tool_name = "svganim"
description = "Self-contained animated SVGs baked from a Node script and its data, every label drawn as a path with the pinned opentype.js and a 2x PNG rendered by sharp"
facet = "image"

[engine]
type = "node"

[engine.node]
runtime = "22.21.0"
runtime_sha256 = "262b84b02f7e2bc017d4bdb81fec85ca0d6190a5cd0781d2d6e84317c08871f8"

[[engine.node.packages]]
name = "opentype.js"
version = "2.0.0"
tarball = "https://registry.npmjs.org/opentype.js/-/opentype.js-2.0.0.tgz"
integrity = "sha512-kCyjv6xdDY1W/jLWZ/L3QhhTlKUqDZMQ5+Jdlw12b3dXkKNpYBqqlMMj0YDQPShWFTMwgZI1hG14kN3XUDSg/A=="

[[engine.node.packages]]
name = "sharp"
version = "0.35.5"
tarball = "https://registry.npmjs.org/sharp/-/sharp-0.35.5.tgz"
integrity = "sha512-Ywn4OnzGukp7CDMrp08RQ50YKmuwG47brZgIVPTvBaaAfQlRlygrRqSrxdCiL9M+LlzLBiJ68IR1QqvzHyjC7g=="

[[engine.node.packages]]
name = "semver"
version = "7.8.6"
tarball = "https://registry.npmjs.org/semver/-/semver-7.8.6.tgz"
integrity = "sha512-9lpSSU4Mly3mrtruwLs1eLK6+gzbzqeBFwRNjIjE+9LuDpWdYctrQlQ3ej1Ilgi7gknpsTRnPoLP8DpCHqHIJw=="

[[engine.node.packages]]
name = "detect-libc"
version = "2.1.2"
tarball = "https://registry.npmjs.org/detect-libc/-/detect-libc-2.1.2.tgz"
integrity = "sha512-Btj2BOOO83o3WyH59e8MgXsxEQVcarkUOpEYrubB0urwnN10yQ364rsiByU11nZlqWYZm05i/of7io4mzihBtQ=="

[[engine.node.packages]]
name = "@img/colour"
version = "1.1.0"
tarball = "https://registry.npmjs.org/@img/colour/-/colour-1.1.0.tgz"
integrity = "sha512-Td76q7j57o/tLVdgS746cYARfSyxk8iEfRxewL9h4OMzYhbW4TAcppl0mT4eyqXddh6L/jwoM75mo7ixa/pCeQ=="

[[engine.node.packages]]
name = "@img/sharp-libvips-linux-x64"
version = "1.3.4"
tarball = "https://registry.npmjs.org/@img/sharp-libvips-linux-x64/-/sharp-libvips-linux-x64-1.3.4.tgz"
integrity = "sha512-GJ//SSXbnwSDes02umB3nDJLFcQzw8a18V8fyhqr6tV515tOEMdImjjxj1AoafMRz56F3PHgftnj1QEKSU1zkw=="

[[engine.node.packages]]
name = "@img/sharp-linux-x64"
version = "0.35.5"
tarball = "https://registry.npmjs.org/@img/sharp-linux-x64/-/sharp-linux-x64-0.35.5.tgz"
integrity = "sha512-SxFtLTeJInhAA9Q836kux2vZNeOBQEx658qvbboZScr0wIARym3IcGmW7KpVD5sbVg0Ojy+udFQdayYIZyoNog=="

[transport]
type = "cli"
entry = "runner.js"
invocation_template = "{{node}} {{entry}} {{verb}} --input {{input}} --result {{result}}"

[requirements]
gpu = false
ram_gb = 2
disk_gb = 1
exclusive = true
platforms = ["linux"]

[[licenses]]
subject = "opentype.js"
spdx = "MIT"

[[licenses]]
subject = "sharp"
spdx = "Apache-2.0"

[capabilities.bake]
summary = "Bake a self-contained animated SVG from a Node script and its data, with every label drawn as a path"
kind = "image"

[capabilities.bake.i18n.es]
summary = "Genera un SVG animado autocontenido desde un script Node y sus datos, con cada etiqueta dibujada como trazado"

[capabilities.bake.inputs.script]
type = "path"
required = true
description = "Node script (CommonJS) that reads the data file path as argv[2] and writes the finished SVG to stdout, resolved relative to the piece; it bakes the CSS @keyframes and converts every label to a <path> with opentype.js."

[capabilities.bake.inputs.data]
type = "path"
required = true
description = "Data file the script reads (JSON, TOML or plain text), passed to the script as argv[2] and resolved relative to the piece."

[capabilities.bake.preview]
viewer = "image"
