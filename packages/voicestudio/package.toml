name = "voicestudio"
version = "0.1.0"
requires_facet = ">=0.1.0b1,<0.2"
protocol = 1
provider = "debpalash (VoiceStudio)"
tool_name = "VoiceStudio"
description = "Narration through a self-started VoiceStudio backend with the voxcpm2, omnivoice or cosyvoice engine, checked by transcription"
facet = "voice"
uses = ["textnorm", "audiopreview"]

[engine]
type = "python-env"
python = "3.12"

[transport]
type = "cli"
entry = "runner.py"

[requirements]
gpu = true
ram_gb = 8
disk_gb = 2
exclusive = true
platforms = ["linux"]

[[licenses]]
subject = "VoiceStudio (the backend this package talks to)"
spdx = "AGPL-3.0-only"

[[licenses]]
subject = "faster-whisper"
spdx = "MIT"

[[licenses]]
subject = "ctranslate2"
spdx = "MIT"

[[licenses]]
subject = "cosyvoice (the backend engine)"
spdx = "Apache-2.0"

[[models]]
id = "faster-whisper-small-verify"
hf_repo = "Systran/faster-whisper-small"
revision = "536b0662742c02347bc0e980a01041f333bce120"
bytes = 486212372
spdx = "MIT"
commercial_use = true
requires_acceptance = false
terms_url = "https://huggingface.co/Systran/faster-whisper-small"

[[models]]
id = "omnivoice"
backend = true
spdx = "CC-BY-NC"
commercial_use = false
requires_acceptance = true
terms_url = "https://huggingface.co/k2-fsa/OmniVoice"

[capabilities.speak]
summary = "Narration through a self-started VoiceStudio backend (engine voxcpm2 or omnivoice), checked by transcription"
kind = "audio"

[capabilities.speak.inputs.voice]
type = "enum"
values = ["narradora"]
default = "narradora"
description = "Cloned voice profile registered in the backend (POST /profiles); clones live on the person's machine."

[capabilities.speak.inputs.model]
type = "enum"
values = ["voxcpm2", "omnivoice"]
default = "voxcpm2"
description = "Manifest model id of the engine used by the whole piece: the core gates per piece on this value. Exactly one engine per piece (two voices go in two files and interleave in HyperFrames); only omnivoice pieces require its licence accepted."

[capabilities.speak.inputs.language]
type = "enum"
values = ["es"]
default = "es"
description = "Narration language of the piece."

[capabilities.speak.inputs.clip]
type = "array"
min_items = 1
required = true
description = "Clips to narrate; each writes <name>.wav."

[capabilities.speak.inputs.clip.items.name]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"
description = "Asset base name."

[capabilities.speak.inputs.clip.items.text]
type = "string"
required = true
description = "Narration text."

[capabilities.speak.inputs.clip.items.seed]
type = "integer"
required = true
description = "Synthesis seed; the verification loop regenerates a failed clip with seed + 1."

[capabilities.speak.verify]
thresholds = { wer_max = 0.05 }

[capabilities.speak.preview]
viewer = "audio"

[capabilities.clone]
summary = "Cloned voice on cosyvoice (Apache-2.0, ~15 s/clip)"
kind = "audio"

[capabilities.clone.inputs.voice]
type = "string"
required = true
pattern = "^[0-9a-f]{8}$"
description = "Local clone profile id registered in this backend (POST /profiles); the runner refuses an id that is not installed here."

[capabilities.clone.inputs.model]
type = "enum"
values = ["cosyvoice"]
default = "cosyvoice"
description = "Manifest model id of the engine used by the whole piece: the core gates per piece on this value. Exactly one engine per piece (two voices go in two files and interleave in HyperFrames)."

[capabilities.clone.inputs.language]
type = "enum"
values = ["es"]
default = "es"
description = "Narration language of the piece."

[capabilities.clone.inputs.clip]
type = "array"
min_items = 1
required = true
description = "Clips to narrate; each writes <name>.wav."

[capabilities.clone.inputs.clip.items.name]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"
description = "Asset base name."

[capabilities.clone.inputs.clip.items.text]
type = "string"
required = true
description = "Narration text."

[capabilities.clone.inputs.clip.items.seed]
type = "integer"
required = true
description = "Synthesis seed; the verification loop regenerates a failed clip with seed + 1."

[capabilities.clone.verify]
thresholds = { wer_max = 0.05 }

[capabilities.clone.preview]
viewer = "audio"

[capabilities.profile]
summary = "A local clone profile created from the person's own reference samples; the receipt carries its id"
kind = "text"

[capabilities.profile.inputs.name]
type = "string"
required = true
description = "Profile name; the run writes <name>.profile.json beside the piece."

[capabilities.profile.inputs.ref-audio]
type = "path"
required = true
description = "The person's reference recording, 7-30 s of neutral speech, resolved relative to the piece file and posted as the backend's ref_audio field."

[capabilities.profile.inputs.instruct]
type = "string"
default = ""
description = "Closed design vocabulary: female/male, child to elderly, very low to very high pitch, whisper; accents apply to English only, Spanish comes out Latin."

[capabilities.profile.inputs.language]
type = "enum"
values = ["es"]
default = "es"
description = "Profile language."

[capabilities.profile.preview]
viewer = "generic"
