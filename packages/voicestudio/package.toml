name = "voicestudio"
version = "0.2.0"
requires_facet = ">=0.1.0b1,<0.2"
protocol = 1
provider = "debpalash (VoiceStudio)"
tool_name = "VoiceStudio"
description = "Narration through a facet-managed VoiceStudio backend with the voxcpm2, omnivoice or cosyvoice engine, checked by transcription"
facet = "voice"
uses = ["textnorm", "audiopreview"]

[engine]
type = "python-env"
python = "3.11"

[engine.server]
repo = "https://github.com/debpalash/VoiceStudio.git"
rev = "c2ef99817fc4f2e0271a223c357e57e8df93cbde"
requirements = "uv.lock"
launch = ["python", "-m", "uvicorn", "main:app", "--app-dir", "backend", "--host", "127.0.0.1", "--port", "{{port}}"]
health_url = "http://127.0.0.1:{{port}}/health"
timeout_s = 600
env = { OMNIVOICE_DATA_DIR = "{{data}}", CC = "gcc", CXX = "g++" }

[transport]
type = "cli"
entry = "runner.py"

[requirements]
gpu = true
ram_gb = 8
disk_gb = 40
exclusive = true
platforms = ["linux"]

[[licenses]]
subject = "VoiceStudio (the backend this package talks to)"
spdx = "AGPL-3.0-only"

[[licenses]]
subject = "faster-whisper"
spdx = "MIT"

[[licenses]]
subject = "ctranslate2"
spdx = "MIT"

[[licenses]]
subject = "cosyvoice (the backend engine)"
spdx = "Apache-2.0"

[[models]]
id = "faster-whisper-small-verify"
hf_repo = "Systran/faster-whisper-small"
revision = "536b0662742c02347bc0e980a01041f333bce120"
bytes = 486212372
spdx = "MIT"
commercial_use = true
requires_acceptance = false
terms_url = "https://huggingface.co/Systran/faster-whisper-small"

[[models]]
id = "omnivoice"
backend = true
spdx = "CC-BY-NC"
commercial_use = false
requires_acceptance = true
terms_url = "https://huggingface.co/k2-fsa/OmniVoice"

[capabilities.speak]
summary = "Narration through a facet-managed VoiceStudio backend (engine voxcpm2 or omnivoice), checked by transcription"
kind = "audio"

[capabilities.speak.i18n.es]
summary = "Narración mediante un backend VoiceStudio gestionado por facet (motor voxcpm2 u omnivoice), verificada por transcripción"

[capabilities.speak.inputs.voice]
type = "string"
default = "narradora"
description = "speak voices narradora; own cloned profiles speak via voicestudio.clone on cosyvoice; anything else fails with the recipe."

[capabilities.speak.inputs.model]
type = "enum"
values = ["voxcpm2", "omnivoice"]
default = "voxcpm2"
description = "Manifest model id of the engine used by the whole piece: the core gates per piece on this value. Exactly one engine per piece (two voices go in two files and interleave in HyperFrames); only omnivoice pieces require its licence accepted."

[capabilities.speak.inputs.language]
type = "enum"
values = ["es"]
default = "es"
description = "Narration language of the piece."

[capabilities.speak.inputs.clip]
type = "array"
min_items = 1
required = true
description = "Clips to narrate; each writes <name>.wav."

[capabilities.speak.inputs.clip.items.name]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"
description = "Asset base name."

[capabilities.speak.inputs.clip.items.text]
type = "string"
required = true
description = "Narration text."

[capabilities.speak.inputs.clip.items.seed]
type = "integer"
required = true
description = "Synthesis seed; the verification loop regenerates a failed clip with seed + 1."

[capabilities.speak.inputs.num-step]
type = "integer"
required = false
min = 1
max = 128
description = "Diffusion steps, 1 to 128; omitting it keeps the engine default (voxcpm2 10, omnivoice 16)."

[capabilities.speak.inputs.guidance-scale]
type = "number"
required = false
min = 0
max = 20
description = "Guidance scale, above 0 up to 20; the backend needs it above 0. Omitting it keeps the engine default (2.0 on both engines)."

[capabilities.speak.inputs.cache]
type = "boolean"
default = true
description = "reuse verified clip; false bypasses"

[capabilities.speak.verify]
# cps_es copies the pinned backend's services/speech_rate.py per-language table (es 15.5).
thresholds = { wer_max = 0.05, cps_es = 15.5, duration_min_ratio = 0.5, duration_max_ratio = 2.0 }

[capabilities.speak.preview]
viewer = "audio"

[capabilities.clone]
summary = "Cloned voice on cosyvoice (Apache-2.0, ~15 s/clip)"
kind = "audio"

[capabilities.clone.i18n.es]
summary = "Voz clonada en cosyvoice (Apache-2.0, ~15 s/clip)"

[capabilities.clone.inputs.voice]
type = "string"
required = true
pattern = "^[0-9a-f]{8}$"
description = "Local clone profile id registered in this backend (POST /profiles); the runner refuses an id that is not installed here."

[capabilities.clone.inputs.model]
type = "enum"
values = ["cosyvoice"]
default = "cosyvoice"
description = "Manifest model id of the engine used by the whole piece: the core gates per piece on this value. Exactly one engine per piece (two voices go in two files and interleave in HyperFrames)."

[capabilities.clone.inputs.language]
type = "enum"
values = ["es"]
default = "es"
description = "Narration language of the piece."

[capabilities.clone.inputs.cache]
type = "boolean"
default = true
description = "reuse verified clip; false bypasses"

[capabilities.clone.inputs.clip]
type = "array"
min_items = 1
required = true
description = "Clips to narrate; each writes <name>.wav."

[capabilities.clone.inputs.clip.items.name]
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"
description = "Asset base name."

[capabilities.clone.inputs.clip.items.text]
type = "string"
required = true
description = "Narration text."

[capabilities.clone.inputs.clip.items.seed]
type = "integer"
required = true
description = "Synthesis seed; the verification loop regenerates a failed clip with seed + 1."

[capabilities.clone.verify]
# cps_es copies the pinned backend's services/speech_rate.py per-language table (es 15.5).
thresholds = { wer_max = 0.05, cps_es = 15.5, duration_min_ratio = 0.5, duration_max_ratio = 2.0 }

[capabilities.clone.preview]
viewer = "audio"

[capabilities.profile]
summary = "A local clone profile created from the person's own reference samples; the receipt carries its id"
kind = "text"
# Registering a voice only posts the reference, which VoiceStudio transcribes
# server-side: no synthesis engine, so no engine licence to accept.
models = []
verify_uses_server = true

[capabilities.profile.i18n.es]
summary = "Un perfil de clonación local creado desde las muestras de referencia propias de la persona; el recibo lleva su id"

[capabilities.profile.inputs.name]
type = "string"
required = true
description = "Profile name; the run writes <name>.profile.json beside the piece."

[capabilities.profile.inputs.ref-audio]
type = "path"
required = true
description = "The person's reference recording, 7-30 s of neutral speech, resolved relative to the piece file and posted as the backend's ref_audio field."

[capabilities.profile.inputs.instruct]
type = "string"
default = ""
description = "Closed design vocabulary: female/male, child to elderly, very low to very high pitch, whisper; accents apply to English only, Spanish comes out Latin."

[capabilities.profile.inputs.language]
type = "enum"
values = ["es"]
default = "es"
description = "Profile language."

[capabilities.profile.preview]
viewer = "generic"
