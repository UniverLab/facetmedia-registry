name = "youtube"
version = "0.1.1"
requires_facet = ">=0.1.0b2,<0.2"
protocol = 1
provider = "Google LLC · YouTube Data API v3"
tool_name = "YouTube"
description = "Uploads one video to the lab's YouTube brand channel through the YouTube Data API, private by default, with a read-back check."
facet = "publish"

[engine]
type = "python-env"
python = "3.12"

[transport]
type = "cli"
entry = "runner.py"

[requirements]
gpu = false
ram_gb = 1
disk_gb = 0.5
exclusive = false
platforms = ["linux"]

[[licenses]]
subject = "YouTube Data API (Google LLC)"
spdx = "LicenseRef-YouTube-API-Terms"

[[secrets]]
name = "client-id"
description = "The desktop OAuth client's id, created in the Google Cloud project"
required = true
obtain = "Google Cloud Console, Google Auth Platform: fill Branding (app name, support email, contact), set Audience External with your account as test user, create a Desktop app client under Clients with YouTube Data API v3 enabled, then publish so sign-in does not expire in 7 days"

[[secrets]]
name = "client-secret"
description = "The desktop OAuth client's secret, created with the client id"
required = true
obtain = "Shown with the client id in the same Desktop app client when it is created"

[[secrets]]
name = "refresh-token"
description = "The brand channel's refresh token, stored by facet auth youtube after sign-in"
required = true
obtain = "Stored by the browser sign-in after you pick the brand channel, never typed by hand"
produced_by = "auth"

[capabilities.upload]
summary = "Upload one video to the lab's YouTube brand channel, private by default, with AI disclosure from provenance and a read-back check."
kind = "post"
outward = true

[capabilities.upload.i18n.es]
summary = "Sube un vídeo al canal de YouTube del laboratorio, privado por defecto, con divulgación de IA desde la procedencia y una verificación de lectura."

[capabilities.upload.inputs.video]
type = "path"
required = true
description = "The video file to upload, resolved relative to the piece."

[capabilities.upload.inputs.title]
type = "string"
required = true
description = "The video's title, at most 100 characters."

[capabilities.upload.inputs.description]
type = "string"
required = true
description = "The video's description, at most 5000 characters."

[capabilities.upload.inputs.tags]
type = "array"
description = "The video's tags."

[capabilities.upload.inputs.tags.items.tag]
type = "string"
required = true
description = "One tag."

[capabilities.upload.inputs.category]
type = "string"
required = true
pattern = "^[0-9]{1,3}$"
description = "The numeric YouTube categoryId string from YouTube's fixed table."

[capabilities.upload.inputs.privacy]
type = "enum"
values = ["private", "unlisted", "public"]
default = "private"
description = "The video's privacy status: private, unlisted or public (default private)."

[capabilities.upload.inputs.made-for-kids]
type = "boolean"
required = true
description = "Whether the video is made for kids; required with no default."

[capabilities.upload.inputs.thumbnail]
type = "path"
description = "An optional thumbnail image uploaded after the video."

[capabilities.upload.inputs.notify-subscribers]
type = "boolean"
default = true
description = "Whether to notify subscribers when the video is published."

[capabilities.upload.inputs.synthetic]
type = "boolean"
default = false
description = "Force the synthetic-media disclosure on; a generated source always discloses."

[capabilities.upload.preview]
viewer = "post"
