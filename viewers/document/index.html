<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>facet — document viewer</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/kit/base.css" />
    <link rel="stylesheet" href="./document.css" />
    <script type="module" src="/kit/grain.js"></script>
  </head>
  <body>
    <div class="wrap">
      <div id="error" class="error-box" role="alert" hidden></div>
      <header id="header"></header>
      <main>
        <div class="bar">
          <p id="summary"></p>
          <a id="pdf-link" href="#" target="_blank" rel="noopener">open PDF</a>
        </div>
        <div class="doc">
          <nav id="thumbs" aria-label="pages"></nav>
          <section id="stage">
            <img id="page" alt="" />
            <div class="controls">
              <button id="fit" type="button">1:1</button>
            </div>
          </section>
        </div>
        <h2>document</h2>
        <dl class="kv" id="doc-kv"></dl>
      </main>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
