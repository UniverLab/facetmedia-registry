<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>facet — image viewer</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/kit/base.css" />
    <script type="module" src="/kit/grain.js"></script>
  </head>
  <body>
    <div class="wrap">
      <div id="error" class="error-box" role="alert" hidden></div>
      <header id="header"></header>
      <main>
        <p id="summary"></p>
        <section id="image">
          <h2>image</h2>
          <div id="stage" class="stage fit" tabindex="0">
            <img id="still" alt="" />
          </div>
          <div class="controls">
            <button id="bg" type="button" aria-pressed="false">checkerboard</button>
            <span id="hint" class="muted">click or Z for 1:1 pixels, drag to pan</span>
          </div>
        </section>
        <h2>metrics</h2>
        <table id="stats">
          <tbody></tbody>
        </table>
        <h2>piece</h2>
        <dl class="kv" id="details"></dl>
        <p><a id="asset-link" href="#">open the asset</a></p>
      </main>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
